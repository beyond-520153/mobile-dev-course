<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KFC 点餐 · 前后端联调预览</title>
<style>
/* ==========================================================================
   肯德基手机端复刻版
   设计基准取自官方 H5（order.kfc.com.cn/preorder-taro）运行期 CSS：
   1rem = 40 设计 px（750 设计稿），本文件按 390 视口折算成 CSS px。
   主色 rgb(228,0,48) = #E40030；正文 rgb(35,30,31)；次要 #666；提示 #999；
   页面底色 #F8F8F8；卡片圆角 0.5rem = 10.4px；卡片阴影 rgba(217,217,217,.5)。
   ========================================================================== */
:root{
  --red:#E40030; --text:#231E1F; --sub:#666; --hint:#999;
  --bg:#F8F8F8; --line:#E6E6E6; --r:10.4px;
  --shadow:0 2px 21px rgba(217,217,217,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:#E9EBEE;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);display:flex;flex-direction:column;align-items:center;padding:18px 12px 40px;
}
.page-title{font-size:15px;font-weight:700;color:#333}
.page-hint{font-size:12px;color:#777;margin-top:6px;text-align:center;line-height:1.7}
.page-hint code{background:#fff;border-radius:4px;padding:1px 5px;font-size:11px}

/* 手机外壳 */
.phone{
  width:390px;max-width:100%;height:780px;margin-top:14px;background:var(--bg);
  border-radius:26px;border:8px solid #22262B;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 18px 40px rgba(0,0,0,.22);position:relative;
}
.statusbar{
  height:26px;background:#fff;color:var(--text);font-size:11px;flex:none;
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;
}
.screen{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);position:relative}
.toast{
  position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(0,0,0,.78);
  color:#fff;font-size:12px;padding:8px 14px;border-radius:16px;opacity:0;transition:opacity .22s;
  pointer-events:none;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis;z-index:60;
}
.toast.show{opacity:1}

/* ---------------- 通用导航栏（子页） ---------------- */
.navbar{
  height:48px;background:#fff;display:flex;align-items:center;flex:none;
  padding:0 6px;border-bottom:1px solid var(--line);
}
.navbar .back{width:40px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.navbar .back svg{width:20px;height:20px}
.navbar .title{flex:1;text-align:center;font-size:16.6px;font-weight:600;color:var(--text)}
.navbar .act{min-width:50px;text-align:center;font-size:12.5px;color:var(--sub);cursor:pointer}
.navbar .act.red{color:var(--red)}

/* ---------------- 首页（选餐厅落地页）---------------- */
.home{flex:1;overflow-y:auto;background:var(--bg);scrollbar-width:none}
.home::-webkit-scrollbar{display:none}
.home-banner{position:relative;width:100%;height:260px;overflow:hidden;
  background:linear-gradient(160deg,#F5123C 0%,#E40030 46%,#B00024 100%)}
.hb-mask{position:absolute;inset:0;background:radial-gradient(120% 80% at 82% 18%,rgba(255,255,255,.22),transparent 60%)}
.hb-txt{position:absolute;left:24px;top:34px;color:#fff}
.hb-en{font-size:46px;font-weight:800;font-style:italic;letter-spacing:1px;line-height:1}
.hb-cn{margin-top:6px;font-size:17px;font-weight:700;letter-spacing:6px}
.hb-slogan{margin-top:10px;font-size:12px;opacity:.9;letter-spacing:2px}
.hb-ring{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.18)}
.hb-ring.r1{width:190px;height:190px;right:-44px;top:-30px}
.hb-ring.r2{width:130px;height:130px;right:36px;top:96px;border-color:rgba(255,255,255,.14)}
.hb-ring.r3{width:64px;height:64px;right:-8px;bottom:26px;background:rgba(255,255,255,.1);border:0}
.privacy-pill{
  position:absolute;right:15px;top:51px;height:19px;padding:0 10px;border-radius:9.4px;
  background:rgba(0,0,0,.3);color:#fff;font-size:10.4px;display:flex;align-items:center;gap:3px;
  cursor:pointer;z-index:3;
}
.privacy-pill svg{width:7px;height:7px}
.store-card{
  position:relative;margin:-36.4px 12.5px 12.5px;background:#fff;border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
}
.user-row{
  height:62px;background:#fff;border-radius:var(--r) var(--r) 0 0;
  display:flex;align-items:center;padding:0 12.5px;cursor:pointer;
}
.user-row .ava{width:37px;height:37px;border-radius:50%;border:1px solid #fff;background:#fff;margin-right:11.4px;flex:none}
.user-row .uname{font-size:14.6px;font-weight:500;color:var(--text);line-height:1.05}
.user-row .udesc{font-size:10.4px;color:var(--sub);margin-top:4px}
.store-block{
  background:#fff;border-radius:0 0 var(--r) var(--r);padding:16.6px 13.5px;
  display:flex;justify-content:space-between;min-height:134px;cursor:pointer;
}
.store-title{display:flex;align-items:center;font-size:19.8px;font-weight:700;color:var(--text);line-height:1.15}
.store-title .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px}
.store-title img{width:15px;height:15px;margin-left:5.7px;flex:none}
.store-sub{font-size:11.4px;color:var(--hint);margin-top:5.2px}
.store-tags{display:flex;flex-wrap:wrap;margin-top:5.2px}
.store-tags span{
  background:#F8F8F8;border-radius:4.2px;padding:3px 5px;margin:3px 6px 0 0;
  font-size:11.4px;color:#666660;
}
.store-illu{width:84px;height:84px;flex:none;margin-right:7px}

.start-wrap{margin:0 12.5px 12.5px}
.start-btn{
  height:56px;background:var(--red);border-radius:8.3px;box-shadow:0 6px 21px rgba(51,51,51,.2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.start-btn:active{background:#C8002A}
.start-btn img{width:17px;height:20px;margin-right:8.3px}
.start-t{font-size:16.6px;font-weight:700;color:#fff;line-height:1.12}
.start-e{font-size:11.4px;color:#fff;margin-top:1px}

.temp-order{
  position:relative;margin:0 12.5px 16.6px;height:50px;background:#fff;border-radius:var(--r);
  display:flex;align-items:center;padding:0 13.5px 0 22.9px;
}
.temp-order>img{width:29px;height:29px;margin-right:12.5px;flex:none}
.to-t{font-size:12.5px;font-weight:600;color:var(--text)}
.to-d{font-size:12.5px;color:var(--red);margin-top:1px}
.to-btn{
  margin-left:auto;height:28px;padding:0 12.5px;border:.5px solid var(--red);border-radius:4.2px;
  color:var(--red);font-size:12.5px;font-weight:500;background:#fff;display:flex;align-items:center;cursor:pointer;
}
.to-close{
  position:absolute;right:4px;top:-9px;width:22px;height:22px;
  border-radius:50%;background:rgba(209,209,209,.16);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#999;
}
.to-close svg{width:9px;height:9px}

/* ---------------- 选择餐厅（门店列表）---------------- */
.searchrow{
  background:#fff;padding:9px 12.5px;display:flex;align-items:center;gap:0;flex:none;
}
.city-pick{
  display:flex;align-items:center;gap:3px;font-size:12.5px;color:var(--text);flex:none;cursor:pointer;
  padding-right:8px;max-width:96px;
}
.city-pick img{width:8px;height:5px}
.searchbox{
  flex:1;height:31px;background:#F5F5F5;border-radius:5px;display:flex;align-items:center;padding:0 9px;gap:6px;min-width:0;
}
.searchbox img{width:13px;height:13px;flex:none;opacity:.55}
.searchbox input{
  flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:12.5px;
  font-family:inherit;color:var(--text);
}
.searchbox input::placeholder{color:#B0B0B0}
.login-tip{
  background:#fff;padding:0 12.5px 9px;display:flex;align-items:center;gap:5px;flex:none;
  font-size:11.4px;color:#666;
}
.login-tip .dot{
  width:11px;height:11px;border-radius:50%;border:1px solid #C9C9C9;color:#C9C9C9;font-size:8px;
  display:flex;align-items:center;justify-content:center;flex:none;line-height:1;
}
.login-tip .go{
  margin-left:auto;background:var(--red);color:#fff;font-size:11.4px;height:20px;border-radius:10px;
  padding:0 11px;display:flex;align-items:center;cursor:pointer;
}
.maparea{
  height:150px;background:#F2F2F2;flex:none;position:relative;overflow:hidden;
}
.maparea img{width:100%;height:100%;object-fit:cover;opacity:.9;display:block}
.maparea .pin{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:26px;height:36px;
}
.locbtn{
  position:absolute;right:12px;bottom:12px;width:30px;height:30px;border-radius:50%;background:#fff;
  box-shadow:0 1px 5px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;
  color:#666;cursor:pointer;
}
.storetabs{display:flex;gap:22px;padding:12px 12.5px 6px;background:#fff;flex:none}
.storetabs div{font-size:14.6px;color:var(--hint);cursor:pointer;position:relative;padding-bottom:7px}
.storetabs div.on{color:var(--text);font-weight:700}
.storetabs div.on:after{
  content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:16px;height:2.6px;
  background:var(--red);border-radius:2px;
}
.storelist{flex:1;overflow-y:auto;background:#fff;scrollbar-width:none}
.storelist::-webkit-scrollbar{display:none}
.store-item{padding:13px 12.5px;border-bottom:1px solid #F2F2F2;display:flex;gap:10px;cursor:pointer}
.store-item .si-main{flex:1;min-width:0}
.store-item .si-name{font-size:14.6px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px}
.store-item .si-name .badge{
  font-size:9.4px;font-weight:400;color:var(--red);border:.5px solid var(--red);border-radius:2px;padding:0 3px;
}
.store-item .si-addr{font-size:11.4px;color:var(--hint);margin-top:5px;line-height:1.45}
.store-item .si-meta{font-size:11.4px;color:var(--sub);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.store-item .si-meta b{color:var(--red);font-weight:400}
.store-item .si-btn{
  align-self:center;flex:none;height:28px;padding:0 14px;border-radius:14px;border:.5px solid var(--red);
  color:var(--red);font-size:12.5px;background:#fff;display:flex;align-items:center;cursor:pointer;
}
.store-item .si-btn.on{background:var(--red);color:#fff}
.store-dist{font-size:11.4px;color:var(--hint);margin-left:auto;flex:none;padding-top:3px}

/* ---------------- 点餐页 ---------------- */
.order-head{background:#fff;flex:none;padding:6px 12.5px 9px;border-bottom:1px solid #F2F2F2}
.oh-row{display:flex;align-items:center;gap:8px}
.oh-back{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;flex:none}
.oh-back svg{width:19px;height:19px}
.oh-store{font-size:14.6px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oh-switch{font-size:11.4px;color:var(--sub);border:.5px solid var(--line);border-radius:9px;padding:1px 7px;flex:none;cursor:pointer}
.oh-tabs{display:flex;gap:16px;margin-top:7px;align-items:center}
.oh-tabs div{font-size:13.5px;color:var(--hint);cursor:pointer;position:relative;padding-bottom:5px}
.oh-tabs div.on{color:var(--text);font-weight:700}
.oh-tabs div.on:after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:14px;height:2.4px;background:var(--red);border-radius:2px}
.oh-tabs .tsearch{margin-left:auto;display:flex;align-items:center;gap:5px;background:#F5F5F5;border-radius:14px;height:26px;padding:0 10px}
.oh-tabs .tsearch svg{width:12px;height:12px;color:#B0B0B0}
.oh-tabs .tsearch input{border:0;background:transparent;outline:none;font-size:11.4px;width:96px;font-family:inherit;color:var(--text)}

.menu{flex:1;display:flex;overflow:hidden;background:#fff}
.rail{width:76px;background:#F7F7F7;overflow-y:auto;flex:none;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .cat{
  min-height:58px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:11.4px;color:var(--text);cursor:pointer;text-align:center;line-height:1.2;
}
.rail .cat img{width:22px;height:22px;object-fit:contain}
.rail .cat.on{background:#fff;color:var(--red);font-weight:700}
.goods{flex:1;overflow-y:auto;padding:8px 6px 76px;scrollbar-width:none}
.goods::-webkit-scrollbar{display:none}
.goods-title{font-size:12.5px;font-weight:700;color:var(--text);padding:4px 2px 8px;display:flex;align-items:center;gap:5px}
.goods-title em{font-style:normal;font-size:10.4px;color:var(--hint);font-weight:400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard{
  background:#fff;border:.5px solid #E6E6E6;border-radius:4.2px;padding:8px 4px 10px;
  display:flex;flex-direction:column;position:relative;cursor:pointer;overflow:hidden;
}
.pcard .pic{width:100%;height:82px;display:flex;align-items:center;justify-content:center}
.pcard .pic img{max-width:100%;max-height:82px;object-fit:contain;display:block}
.pcard .pname{font-size:13px;color:var(--text);line-height:1.28;margin-top:6px;height:33px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard .plabel{
  display:block;background:#F8E2B7;border-radius:4px;height:14px;line-height:14px;
  padding:0 4px;font-size:9px;color:#403C33;margin-top:4px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%;
}
.pcard .prow{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;margin-top:auto;padding-top:6px;min-height:22px}
.pcard .pgrp{display:flex;align-items:baseline;flex:1 1 auto;min-width:0;overflow:hidden}
.pcard .pprice{color:var(--red);font-size:13.6px;font-weight:700;line-height:1.1;flex:none}
.pcard .pprice small{font-size:9.4px;font-weight:400}
.pcard .porigin{color:#B0B0B0;font-size:9.2px;text-decoration:line-through;margin-left:3px;line-height:1.4;flex-shrink:1;overflow:hidden}
.pcard .add{
  flex:none;margin-left:auto;width:23px;height:22px;background:var(--red);margin-bottom:-5px;margin-right:-3px;
  border-radius:4px 0 4px 0;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.pcard .add svg{width:11px;height:11px;color:#fff}
.pcard .add.off{background:#D8D8D8;cursor:not-allowed}
.empty-tip{padding:38px 0;text-align:center;color:var(--hint);font-size:12.5px}

.cartbar{
  height:56px;background:#fff;border-top:1px solid #F0F0F0;display:flex;align-items:center;
  padding:0 12.5px 0 14px;flex:none;position:absolute;left:0;right:0;bottom:0;z-index:5;
}
.cartbar .cicon{
  width:46px;height:46px;border-radius:50%;background:var(--red);display:flex;align-items:center;
  justify-content:center;position:absolute;left:14px;bottom:16px;box-shadow:0 2px 8px rgba(228,0,48,.35);cursor:pointer;
}
.cartbar .cicon svg{width:22px;height:22px;color:#fff}
.cartbar .cicon.off{background:#CFCFCF;box-shadow:none}
.cartbar .cnum{
  position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:#fff;
  color:var(--red);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;
  padding:0 3px;border:.5px solid var(--red);
}
.cartbar .cinfo{margin-left:58px;flex:1;min-width:0}
.cartbar .camt{font-size:17.7px;font-weight:700;color:var(--text);line-height:1.1}
.cartbar .camt small{font-size:10.4px;font-weight:400}
.cartbar .csub{font-size:10.4px;color:var(--hint);margin-top:2px}
.cartbar .cgo{
  flex:none;height:36px;min-width:96px;border-radius:18px;background:var(--red);color:#fff;
  font-size:14.6px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.cartbar .cgo.off{background:#D8D8D8;color:#fff}

/* ---------------- 购物车 / 订单 / 地址 通用 ---------------- */
.list{flex:1;overflow-y:auto;padding:10px 12.5px 90px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.card{background:#fff;border-radius:var(--r);padding:12px;margin-bottom:10px}
.card-h{display:flex;align-items:center;font-size:13.5px;font-weight:700;margin-bottom:10px}
.card-h .more{margin-left:auto;font-size:11.4px;color:var(--sub);font-weight:400;cursor:pointer}
.ci{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #F5F5F5}
.ci:last-child{border-bottom:0}
.ci img{width:64px;height:64px;border-radius:6px;object-fit:contain;background:#FFF8EE;flex:none}
.ci .cd{flex:1;min-width:0;display:flex;flex-direction:column}
.ci .cn{font-size:13px;color:var(--text);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .cs{font-size:10.4px;color:var(--hint);margin-top:3px}
.ci .cf{margin-top:auto;display:flex;align-items:center}
.ci .cp{color:var(--red);font-size:14.6px;font-weight:700}
.ci .cp small{font-size:9.4px;font-weight:400}
.stepper{display:flex;align-items:center;gap:7px;margin-left:auto}
.stepper .op{
  width:22px;height:22px;border-radius:50%;border:.5px solid #DDD;background:#fff;color:var(--text);
  display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;line-height:1;
}
.stepper .op.plusop{background:var(--red);border-color:var(--red);color:#fff}
.stepper .qty{min-width:16px;text-align:center;font-size:13px;font-weight:700}
.row{display:flex;align-items:center;font-size:12.5px;color:var(--sub);padding:7px 0}
.row b{margin-left:auto;color:var(--text);font-weight:600}
.row b.red{color:var(--red);font-size:14.6px}
.hr{height:1px;background:#F2F2F2;margin:6px 0}
.btn{
  height:40px;border-radius:20px;background:var(--red);color:#fff;font-size:14.6px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;font-family:inherit;width:100%;
}
.btn:disabled{background:#D8D8D8;}
.btn.ghost{background:#fff;color:var(--red);border:.5px solid var(--red)}
.btn.small{height:29px;border-radius:15px;font-size:12.5px;width:auto;padding:0 16px;font-weight:500}
.bottombar{
  position:absolute;left:0;right:0;bottom:0;height:60px;background:#fff;border-top:1px solid #F0F0F0;
  display:flex;align-items:center;gap:10px;padding:0 12.5px;z-index:5;
}
.bottombar .binfo{flex:1;min-width:0}
.bottombar .bamt{font-size:17.7px;font-weight:700;color:var(--red);line-height:1.1}
.bottombar .bamt small{font-size:10.4px;font-weight:400}
.bottombar .bsub{font-size:10.4px;color:var(--hint);margin-top:2px}
.bottombar .btn{width:auto;min-width:104px;padding:0 20px;height:38px;border-radius:19px;font-size:14.6px}

/* 订单卡 */
.ocard{background:#fff;border-radius:var(--r);padding:12px;margin-bottom:10px}
.ocard .oh{display:flex;align-items:center;font-size:12.5px;color:var(--sub)}
.ocard .oh .st{margin-left:auto;color:var(--red);font-weight:600;font-size:12.5px}
.ocard .oh .st.done{color:var(--hint)}
.ocard .ob{display:flex;gap:8px;margin:10px 0 8px}
.ocard .ob img{width:58px;height:58px;border-radius:6px;object-fit:contain;background:#FFF8EE;flex:none}
.ocard .of{display:flex;align-items:center;font-size:11.4px;color:var(--hint)}
.ocard .of b{margin-left:auto;font-size:13px;color:var(--text)}
.ocard .of b em{font-style:normal;color:var(--red);font-size:14.6px;font-weight:700}
.ocard .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}

/* 地址卡 */
.acard{background:#fff;border-radius:var(--r);padding:13px;margin-bottom:10px;display:flex;gap:10px;cursor:pointer}
.acard .ad{flex:1;min-width:0}
.acard .an{font-size:14.6px;font-weight:700}
.acard .an span{font-size:12.5px;color:var(--sub);font-weight:400;margin-left:8px}

/* ============================ 接口 ============================ */
async function api(path, opt) {
  const o = Object.assign({}, opt || {});
  o.headers = Object.assign({ 'Content-Type': 'application/json' }, o.headers || {});
  const r = await fetch(path, o);
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('接口返回异常 HTTP ' + r.status); }
  if (j.code !== 200) throw new Error(j.message || '请求失败');
  return j.data;
}
const qs = o => Object.keys(o).filter(k => o[k] != null && o[k] !== '')

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

const userId = () => (S.user ? S.user.id : null);
const needLogin = () => { if (!userId()) { go('login'); return true; } return false; };

/* ============================ 路由 ============================ */
function go(page, payload) {
  S.page = page;

  if (page === 'menu') { S.keyword = ''; S.searchResults = null; }
  render();
  const sc = document.querySelector('.home, .list, .goods, .mine');
  if (sc) sc.scrollTop = 0;
}

function render() {
  const el = screenEl();
  switch (S.page) {
    case 'entry': el.innerHTML = viewEntry(); break;
    case 'stores': el.innerHTML = viewStores(); break;
    case 'menu': el.innerHTML = viewMenu(); break;
    case 'cart': el.innerHTML = viewCart(); break;
    case 'orders': el.innerHTML = viewOrders(); break;
    case 'orderDetail': el.innerHTML = viewOrderDetail(); break;
    case 'address': el.innerHTML = viewAddress(); break;
    case 'login': el.innerHTML = viewLogin(); break;
    case 'mine': el.innerHTML = viewMine(); break;
    default: el.innerHTML = viewEntry();

  document.getElementById('sbtitle').textContent =
    S.page === 'entry' ? '肯德基' : (S.page === 'menu' ? '点餐' : '肯德基');
  bind();
  after();
}

function grid(list) {
  if (!list.length) return '<div class="empty-tip">没有找到相关餐品</div>';
  return '<div class="grid">' + list.map(p => {
    const img = p.image ? ('<img src="' + esc(p.image) + '" alt="">') : '';
    const origin = (p.originPrice && Number(p.originPrice) > Number(p.price))
      ? '<span class="porigin">\u00A5' + Number(p.originPrice).toFixed(2) + '</span>' : '';
    const off = (p.stock != null && p.stock <= 0);
    return '<div class="pcard" data-pid="' + p.id + '">' +
      '<div class="pic">' + img + '</div>' +
      '<div class="pname">' + esc(p.name) + '</div>' +
      (p.description ? '<div class="plabel">' + esc(String(p.description).slice(0, 12)) + '</div>' : '') +
      '<div class="prow"><span class="pgrp"><span class="pprice"><small>\u00A5</small>' + Number(p.price).toFixed(2) + '</span>' +
        origin + '</span>' +
      '<span class="add ' + (off ? 'off' : '') + '" data-add="' + p.id + '">' + svg(P.plus) + '</span>' +
      '</div>' +
    '</div>';
  }).join('') + '</div>';
}

/* ============================ 事件 ============================ */
function bind() {
  const el = screenEl();
  el.querySelectorAll('[data-act]').forEach(n => {
    n.addEventListener('click', ev => {
      const act = n.getAttribute('data-act');
      onAct(act, ev);
    });
  });
  el.querySelectorAll('[data-cat]').forEach(n => {
    n.addEventListener('click', () => {
      S.catId = Number(n.getAttribute('data-cat'));
      S.keyword = ''; S.searchResults = null;
      render();
    });
  });
  el.querySelectorAll('[data-pick]').forEach(n => {
    n.addEventListener('click', () => { S.pickup = n.getAttribute('data-pick'); render(); });
  });
  el.querySelectorAll('[data-add]').forEach(n => {
    n.addEventListener('click', ev => { ev.stopPropagation(); addCart(Number(n.getAttribute('data-add'))); });
  });
  el.querySelectorAll('[data-inc]').forEach(n => {
    n.addEventListener('click', () => changeQty(Number(n.getAttribute('data-inc')), +1));
  });
  el.querySelectorAll('[data-dec]').forEach(n => {
    n.addEventListener('click', () => changeQty(Number(n.getAttribute('data-dec')), -1));
  });
  el.querySelectorAll('[data-detail]').forEach(n => {
    n.addEventListener('click', () => { S.orderId = Number(n.getAttribute('data-detail')); go('orderDetail'); });
  });
  el.querySelectorAll('[data-pay]').forEach(n => {
    n.addEventListener('click', () => payOrder(Number(n.getAttribute('data-pay'))));
  });
  el.querySelectorAll('[data-cancel]').forEach(n => {
    n.addEventListener('click', () => cancelOrder(Number(n.getAttribute('data-cancel'))));
  });
  el.querySelectorAll('[data-setdef]').forEach(n => {
    n.addEventListener('click', ev => { ev.stopPropagation(); setDefaultAddress(Number(n.getAttribute('data-setdef'))); });
  });
  el.querySelectorAll('[data-deladdr]').forEach(n => {
    n.addEventListener('click', () => delAddress(Number(n.getAttribute('data-deladdr'))));
  });
}

function after() {
  const kw = document.getElementById('kw');
  if (kw) {
    let t = null;
    kw.addEventListener('input', () => {
      const v = kw.value.trim();
      clearTimeout(t);
      t = setTimeout(() => doSearch(v), 300);
    });
  }
  const lu = document.getElementById('lu');
  if (lu) lu.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  const lp = document.getElementById('lp');
  if (lp) lp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

async function onAct(act) {
  switch (act) {
    case 'home': go('entry'); break;
    case 'start': go('menu'); loadMenu(); break;
    case 'stores': go('stores'); break;
    case 'menu': go('menu'); loadMenu(); break;
    case 'cart': go('cart'); loadCart(); break;
    case 'checkout': checkout(); break;
    case 'login': go('login'); break;
    case 'user': S.user ? go('mine') : go('login'); break;
    case 'mine': go('mine'); break;
    case 'orders': go('orders'); loadOrders(); break;
    case 'address': if (!needLogin()) { go('address'); loadAddress(); } break;
    case 'tab0': S.storeTab = 0; render(); break;
    case 'tab1': S.storeTab = 1; render(); break;
    case 'refresh': toast('已按定位刷新附近餐厅'); break;
    case 'refreshOrders': loadOrders(); break;
    case 'closeTemp': S.entryClosed = true; render(); break;
    case 'temp': toast('未登录订单功能开发中'); break;
    case 'privacy': toast('隐私政策（演示占位）'); break;
    case 'maptoggle': toast('地图已收起（演示占位）'); break;
    case 'clear': clearCart(); break;
    case 'doLogin': doLogin(); break;
    case 'fillDemo': {
      const u = document.getElementById('lu'), p = document.getElementById('lp');
      if (u) u.value = 'demo';
      if (p) p.value = '123456';
      break;
    }
    case 'logout': S.user = null; localStorage.removeItem('kfc_user'); go('entry'); toast('已退出登录'); break;
    case 'addAddr': toast('新增地址（演示占位）'); break;
    default: break;
  }
}

/* ============================ 业务 ============================ */
async function loadMenu() {
  try {
    if (!S.cats.length) {
      const [cats, prods] = await Promise.all([api('/api/categories'), api('/api/products')]);
      S.cats = cats || [];
      S.products = (prods || []).filter(p => p.status !== 0);
      if (!S.catId && S.cats.length) S.catId = S.cats[0].id;
      render();
    }
    await loadCartSummary();
  } catch (e) { toast(e.message); }
}

async function loadCartSummary() {
  if (!userId()) { S.cart = { count: 0, amount: 0 }; return; }
  try {
    const s = await api('/api/cart-items/summary?userId=' + userId());
    S.cart = { count: s.count || 0, amount: s.amount || 0 };
    if (S.page === 'menu') render();
  } catch (e) { /* 静默 */ }
}

async function doSearch(kw) {
  S.keyword = kw;
  if (!kw) { S.searchResults = null; render(); return; }
  try {
    const r = await api('/api/products/search?keyword=' + encodeURIComponent(kw));
    S.searchResults = (r || []).filter(p => p.status !== 0);
  } catch (e) { S.searchResults = []; }
  render();
  const g = document.getElementById('goods');
  if (g) g.scrollTop = 0;
}

async function addCart(pid) {
  if (needLogin()) return;
  const p = S.products.find(x => x.id === pid);
  if (p && p.stock != null && p.stock <= 0) { toast('该餐品已售罄'); return; }
  try {
    await api('/api/cart-items', {
      method: 'POST',
      body: JSON.stringify({ userId: userId(), productId: pid, quantity: 1 })
    });
    await loadCartSummary();
    toast('已加入购物车');
  } catch (e) { toast(e.message); }
}

async function loadCart() {
  if (needLogin()) return;
  try {
    S.cartItems = await api('/api/cart-items?userId=' + userId());
    render();
  } catch (e) { toast(e.message); }
}

async function changeQty(id, delta) {
  const it = S.cartItems.find(x => x.id === id);
  if (!it) return;
  const q = Number(it.quantity) + delta;
  try {
    if (q <= 0) {
      await api('/api/cart-items/' + id + '?userId=' + userId(), { method: 'DELETE' });
      S.cartItems = S.cartItems.filter(x => x.id !== id);
    } else {
      await api('/api/cart-items/' + id, { method: 'PUT', body: JSON.stringify({ quantity: q }) });
      it.quantity = q;
      it.subtotal = Number(it.price) * q;
    }
    await loadCartSummary();
    render();
  } catch (e) { toast(e.message); }
}

async function clearCart() {
  if (!S.cartItems.length) return;
  try {
    await api('/api/cart-items?userId=' + userId(), { method: 'DELETE' });
    S.cartItems = [];
    await loadCartSummary();
    render();
  } catch (e) { toast(e.message); }
}

async function checkout() {
  if (needLogin()) return;
  try {
    const s = await api('/api/cart-items/summary?userId=' + userId());
    if (!s || !s.count) { toast('购物车是空的'); return; }
    let addrId = null;
    try {
      const list = await api('/api/addresses?userId=' + userId());
      S.addresses = list || [];
      const def = S.addresses.find(a => a.isDefault) || S.addresses[0];
      addrId = def ? def.id : null;
    } catch (e) { /* 没地址也能下单（到店自取） */ }

    const o = await api('/api/orders', {
      method: 'POST',
      body: JSON.stringify({ userId: userId(), addressId: addrId, pickupType: S.pickup, remark: '' })
    });
    toast('下单成功');
    S.cart = { count: 0, amount: 0 };
    S.cartItems = [];
    await loadOrders();
    S.orderId = o.id;
    go('orderDetail');
  } catch (e) { toast(e.message); }
}

async function loadOrders() {
  if (!userId()) { S.orders = []; render(); return; }
  try {
    const list = await api('/api/orders?userId=' + userId());
    S.orders = list || [];
    // 拉每单明细（列表要展示缩略图与件数）
    await Promise.all(S.orders.map(async o => {
      if (o.itemCount && o.itemCount > 0) {
        try { const d = await api('/api/orders/' + o.id); o.items = d.items || []; }
        catch (e) { o.items = []; }
      } else { o.items = []; }
    }));
    render();
  } catch (e) { toast(e.message); }
}

async function payOrder(id) {
  try { await api('/api/orders/' + id + '/pay', { method: 'POST' }); toast('支付成功'); await loadOrders(); }
  catch (e) { toast(e.message); }
}
async function cancelOrder(id) {
  try { await api('/api/orders/' + id + '/cancel', { method: 'POST' }); toast('已取消，库存已回补'); await loadOrders(); }
  catch (e) { toast(e.message); }
}

async function loadAddress() {
  try { S.addresses = await api('/api/addresses?userId=' + userId()) || []; render(); }
  catch (e) { toast(e.message); }
}
async function delAddress(id) {
  try { await api('/api/addresses/' + id + '?userId=' + userId(), { method: 'DELETE' }); await loadAddress(); }
  catch (e) { toast(e.message); }
}
async function setDefaultAddress(id) {
  const a = (S.addresses || []).find(x => String(x.id) === String(id));
  if (!a) { return; }
  try {
    await api('/api/addresses/' + id, { method: 'PUT', body: JSON.stringify({
      userId: a.userId, receiver: a.receiver, phone: a.phone,
      province: a.province || '', city: a.city || '', district: a.district || '',
      detail: a.detail, isDefault: true }) });
    await loadAddress(); toast('已设为默认地址');
  } catch (e) { toast(e.message); }
}

async function doLogin() {
  const u = (document.getElementById('lu') || {}).value || '';
  const p = (document.getElementById('lp') || {}).value || '';
  if (!u || !p) { toast('请输入用户名和密码'); return; }
  try {
    const user = await api('/api/users/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
    S.user = user;
    localStorage.setItem('kfc_user', JSON.stringify(user));
    toast('登录成功');
    await loadCartSummary();
    go('menu');
    loadMenu();
  } catch (e) { toast(e.message); }
}

/* ============================ 启动 ============================ */
async function boot() {
  document.getElementById('apiBase').textContent = location.origin;
  try {
    const u = JSON.parse(localStorage.getItem('kfc_user') || 'null');
    if (u && u.id) S.user = u;
  } catch (e) { /* ignore */ }

  const now = new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

  try {
    const r = await fetch('/api/categories');
    document.getElementById('health').textContent = r.ok ? '正常' : ('HTTP ' + r.status);
  } catch (e) {
    document.getElementById('health').textContent = '连接失败';
  }

  render();
  loadMenu();
  if (S.user) loadCartSummary();
}
boot();
</script>
