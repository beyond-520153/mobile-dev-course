<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KFC 点餐 · 前后端联调预览</title>
<style>
  :root{
    /* 色值对齐官方实测值：主色 rgb(228,0,48)、正文 #231E1F、页面底 #F9F9F9 */
    --primary:#E40030; --primary-dark:#C10023; --accent:#FFC72C;
    --bg:#F9F9F9; --card:#FFFFFF; --sidebar:#F7F7F7;
    --text:#231E1F; --sub:#8A8A8A; --hint:#B5B5B5; --line:#F2F2F2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:#E9EBEE;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);display:flex;flex-direction:column;align-items:center;padding:18px 12px 40px;
  }
  .page-title{font-size:15px;font-weight:700;color:#333}
  .page-hint{font-size:12px;color:#777;margin-top:6px;text-align:center;line-height:1.7}
  .page-hint code{background:#fff;border-radius:4px;padding:1px 5px;font-size:11px}

  /* 手机外壳 */
  .phone{
    width:390px;max-width:100%;height:780px;margin-top:14px;background:var(--bg);
    border-radius:26px;border:8px solid #22262B;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 18px 40px rgba(0,0,0,.22);position:relative;
  }
  .statusbar{
    height:26px;background:var(--primary);color:#fff;font-size:11px;
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex:none;
    transition:background .18s,color .18s;
  }
  /* 点餐页顶栏是白/浅灰分层，状态条跟着变浅，否则顶上一条红带会把「像不像」全毁掉 */
  .statusbar.light{background:#F9F9F9;color:#231E1F;border-bottom:1px solid #F2F2F2}
  .screen{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}

  /* 通用 */
  .navbar{
    height:46px;background:#fff;display:flex;align-items:center;flex:none;
    border-bottom:1px solid var(--line);padding:0 6px;
  }
  /* 返回：矢量箭头（原来是文字字符 ‹），与点餐页顶栏保持同一套图标语言 */
  .navbar .back{
    width:40px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--text);
  }
  .navbar .back .ic-svg{height:20px}
  .navbar .title{flex:1;text-align:center;font-size:16px;font-weight:700}
  .navbar .act{width:50px;text-align:center;font-size:13px;color:var(--primary);cursor:pointer}
  .toast{
    position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(0,0,0,.78);
    color:#fff;font-size:12px;padding:8px 14px;border-radius:16px;opacity:0;transition:opacity .22s;
    pointer-events:none;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis;z-index:50;
  }
  .toast.show{opacity:1}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--sub);font-size:13px;gap:10px}
  .empty .big{font-size:44px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 16px;
    border-radius:17px;background:var(--primary);color:#fff;font-size:13px;font-weight:700;
    border:none;cursor:pointer;font-family:inherit;
  }
  .btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
  .btn.gray{background:#fff;color:var(--sub);border:1px solid var(--line)}
  .btn:disabled{background:#D0D0D0;cursor:not-allowed}

  /* ================= 点餐页顶栏 =================
     官方是白/浅灰三层：搜索行(46) → 门店行(60) → 频道 tab(41)，
     不是一整块红通栏。数值按 430→390 等比折算。 */
  .hd{background:#F9F9F9;flex:none}
  .hd-search{display:flex;align-items:center;gap:2px;height:45px;padding:0 12px 0 2px}
  .hd-search .back{
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    color:#231E1F;cursor:pointer;flex:none;
  }
  .hd-search .back:active{opacity:.55}
  .hd-search .bar{
    flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:37px;
    background:#EEEEEE;border-radius:5px;padding:0 10px;
  }
  .hd-search .bar .mag{color:#9A9A9A;display:flex;flex:none}
  .hd-search input{
    flex:1;min-width:0;height:100%;border:none;background:transparent;outline:none;
    font-size:14.5px;font-family:inherit;color:#231E1F;
  }
  .hd-search input::placeholder{color:rgba(35,30,31,.42)}
  .hd-search .clear{
    width:16px;height:16px;border-radius:50%;background:#C9C9C9;color:#fff;font-size:12px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;line-height:1;
  }
  .hd-search .clear.hide{display:none}

  /* 门店行：店名 40rpx/500 + ⓘ，副行「自取 | 地址」；右侧「预约」描边按钮 */
  .hd-store{display:flex;align-items:flex-start;gap:7px;padding:4px 14px 9px 12px}
  .hd-store .sic{width:19px;height:19px;flex:none;color:#231E1F;margin-top:2px;display:flex}
  .hd-store .sic svg{width:19px;height:19px}
  .hd-store .txt{flex:1;min-width:0}
  .hd-store .nm{display:flex;align-items:center;gap:5px;font-size:20.8px;font-weight:500;color:#231E1F;line-height:1.16}
  .hd-store .nm .info{width:13px;height:13px;color:#B4B4B4;flex:none;display:flex}
  .hd-store .nm .info svg{width:13px;height:13px}
  .hd-store .addr{
    margin-top:3px;font-size:11.5px;color:#8A8A8A;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hd-store .book{
    flex:none;min-width:52px;height:34px;padding:0 9px;border-radius:4px;background:#fff;
    border:1px solid var(--primary);color:var(--primary);font-size:12.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .hd-store .book:active{background:#FFF2F4}

  /* 频道 tab：经典菜单（红色短下划线）/ 大神卡（右上「专享」角标） */
  .hd-tabs{position:relative;display:flex;align-items:center;gap:26px;height:37px;padding:0 16px}
  .hd-tabs .t{
    position:relative;height:100%;display:flex;align-items:center;
    font-size:15px;color:#6E6E6E;cursor:pointer;
  }
  .hd-tabs .t.on{color:#231E1F;font-weight:600}
  .hd-tabs .t.on::after{
    content:'';position:absolute;left:50%;bottom:7px;transform:translateX(-50%);
    width:24px;height:2px;border-radius:1px;background:var(--primary);
  }
  .hd-tabs .t .tag{
    position:absolute;top:2px;right:-19px;background:var(--primary);color:#fff;
    font-size:8px;line-height:1;padding:2px 3px;border-radius:2px;font-weight:500;
  }

  /* 公告条：只铺在右侧内容区，跨在分类标题上方 */
  .notice{
    height:34px;display:flex;align-items:center;justify-content:center;gap:9px;flex:none;
    background:#F9F9F9;color:#231E1F;font-size:12.5px;
  }
  .notice svg{width:13px;height:13px;color:#3FA35A;flex:none}

  /* 点餐主体 */
  .menu{flex:1;display:flex;overflow:hidden;background:#fff}
  .sidebar{width:66px;background:#F7F7F7;overflow-y:auto;flex:none;scrollbar-width:none}
  .sidebar::-webkit-scrollbar{display:none}
  .sidebar .item{
    position:relative;min-height:52px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;font-size:12.5px;line-height:1.28;color:#231E1F;
    padding:5px 4px;cursor:pointer;word-break:break-all;
  }
  .sidebar .item b{font-weight:400}
  .sidebar .item.on{background:var(--primary);color:#fff}
  .sidebar .item.on b{font-weight:500}
  /* 首项「人气热卖」上沿挂红色 HOT 角标，与官方一致 */
  .sidebar .item.hot{padding-top:17px}
  /* HOT 角标：官方是压在选中红块左上角的一枚标签，白底红字，右下角带小圆角 */
  .sidebar .item.hot::before{
    content:'HOT';position:absolute;top:0;left:0;background:#fff;color:var(--primary);
    font-size:7.5px;font-weight:700;line-height:13px;padding:0 4px;letter-spacing:.4px;
    border-radius:0 0 4px 0;
  }
  .mainwrap{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .products{flex:1;min-width:0;overflow-y:auto;background:#F9F9F9;scrollbar-width:none;position:relative}
  .products::-webkit-scrollbar{display:none}
  .cat-title{
    height:31px;display:flex;align-items:center;gap:5px;
    font-size:12px;color:#6E6E6E;background:#F7F7F7;
    padding:0 12px 0 2px;position:sticky;top:0;z-index:2;
  }
  .cat-title::before{content:'';width:3px;height:12px;background:var(--primary);border-radius:1px;flex:none}
  /* 商品行：官方是「大图 + 右对齐文字」，图占内容区 54%，文字只占右侧一条 */
  .prod{display:flex;padding:10px 12px 10px 0;background:#fff;position:relative}
  /* 图片容器：给售罄胶囊留一个定位基准（img 上不能挂伪元素） */
  .thumbwrap{position:relative;flex:none;display:flex;align-items:center;justify-content:center}
  .thumbwrap .sold{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(58,58,58,.72);color:#fff;font-size:12px;line-height:1;
    padding:7px 15px;border-radius:4px;white-space:nowrap;
  }
  .prod.sold img.thumb{opacity:.5;filter:grayscale(.55)}
  .prod.sold .price{color:#999}
  .thumb{
    width:78px;height:78px;border-radius:16px;background:#FFF4E0;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:36px;
  }
  .prod .thumb{width:176px;height:auto;border-radius:8px;background:transparent}
  /* 官方运营图是宽幅 banner，宽度固定、高度按比例，不裁不压 */
  .prod img.pthumb{width:176px;height:auto;object-fit:contain;border-radius:0}
  .prod .thumb.pthumb{width:176px;height:107px}
  .prod .info{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;
    text-align:right;padding-left:6px;
  }
  .prod .name{
    width:100%;font-size:12.5px;font-weight:500;color:#231E1F;line-height:1.32;text-align:right;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;
  }
  .prod .desc{
    width:100%;margin-top:3px;font-size:11px;color:#9A9A9A;line-height:1.35;text-align:right;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .prod .price-row{
    display:flex;align-items:baseline;gap:4px;margin-top:5px;
    flex-wrap:wrap;justify-content:flex-end;
  }
  .prod .tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;justify-content:flex-end}
  .prod .tags span{
    border:1px solid var(--primary);color:var(--primary);font-size:9.5px;line-height:14px;
    padding:0 3px;border-radius:2px;white-space:nowrap;
  }
  .prod .act{width:100%;margin-top:auto;padding-top:8px;display:flex;justify-content:flex-end}
  .btn-spec{
    width:62px;height:31px;border-radius:4px;background:var(--primary);color:#fff;font-size:12px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;
  }
  .btn-spec:active{background:var(--primary-dark)}
  /* 售罄行的「查看有货餐厅」比「选规格」宽，按内容自适应 */
  .btn-spec.more{width:auto;padding:0 11px;font-size:11.5px;white-space:nowrap}
  .price{display:inline-flex;align-items:baseline;color:var(--primary);font-weight:600}
  .price i{font-size:11px;font-style:normal}
  .price b{font-size:19px;font-weight:600;letter-spacing:-.3px}
  .price em{font-size:12.5px;font-style:normal}
  .price u{font-size:10.5px;text-decoration:none;margin-left:1px}
  img.thumb{object-fit:cover;display:block;padding:0}
  /* 点餐页的商品图是官方运营图（自带红底促销文案），必须完整显示、不能裁切，也没有圆角 */
  .prod img.thumb{object-fit:contain;border-radius:0}
  .origin{color:#9A9A9A;font-size:11px;text-decoration:line-through}
  /* 会员价标签：登录且持卡时后端才下发 memberPriceText，未登录这一行不会渲染 */
  .mtag{
    padding:1px 4px;border-radius:3px;background:#FFF4E0;color:var(--primary);
    font-size:9px;font-weight:700;white-space:nowrap;
  }
  .plus{
    width:31px;height:31px;border-radius:8px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:400;cursor:pointer;
    line-height:1;user-select:none;
  }
  .plus:active{background:var(--primary-dark)}
  .plus.off{background:#D9D9D9;cursor:not-allowed}

  /* 底部购物车条 —— 官方是整条反色：未选餐品整条灰底白字，有商品整条红底白字，
     不是白底 + 红字。高度 100rpx=52px，圆角只有右端（左侧贴边）。 */
  .cartbar{
    position:relative;height:52px;display:flex;align-items:center;flex:none;
    padding:0 12px 0 106px;gap:9px;background:#C6C6C6;color:#fff;
    cursor:pointer;transition:background .15s;
  }
  .cartbar.on{background:var(--primary)}
  .cartbar .bag{width:23px;height:23px;flex:none;display:flex;align-items:center;justify-content:center}
  .cartbar .bag svg{width:23px;height:23px}
  .cartbar .cartinfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
  /* 未选购：只有一行大字「未选购餐品」20.6px/500 */
  .cartbar .ph{font-size:20.5px;font-weight:500;line-height:1.1;letter-spacing:.2px}
  .cartbar .amt{display:flex;align-items:baseline;gap:1px;font-size:20px;font-weight:500;line-height:1.05}
  .cartbar .amt small{font-size:12px;font-weight:400;margin-right:1px}
  .cartbar .amt em{font-size:12.5px;font-style:normal}
  .cartbar .sub{font-size:10px;opacity:.82;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 右侧按钮：未选时与条同色（只留白字），有商品时白底红字 */
  .cartbar .go{
    margin-left:auto;flex:none;height:34px;padding:0 17px;border-radius:4px;border:none;
    background:transparent;color:#fff;font-size:13.5px;font-weight:500;font-family:inherit;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .cartbar.on .go{background:#fff;color:var(--primary)}
  /* 优惠助手：官方是压在购物车条左端的一枚深色胶囊，条的内容整体右移给它让位 */
  .helper-fab{
    position:absolute;left:8px;bottom:0;z-index:9;
    background:#333;color:#fff;font-size:13.5px;line-height:1;padding:13px 15px;border-radius:6px;
    cursor:pointer;white-space:nowrap;
  }

  /* ==================== 规格选择页 ====================
     照官方：返回 + 居中标题 → 分节（左侧黑竖条 + 粗标题）→ 三列选项卡
     → 底部黑色悬浮条 + 重置/加入购物车。 */
  .spec-page{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#fff;position:relative}
  .spec-page .navbar{border-bottom:none;background:#fff}
  .spec-body{flex:1;overflow-y:auto;padding:2px 13px 156px;scrollbar-width:none}
  .spec-body::-webkit-scrollbar{display:none}
  .sg{margin-top:16px}
  .sg-t{
    display:flex;align-items:center;gap:7px;font-size:15.5px;font-weight:700;color:#231E1F;
    margin-bottom:11px;
  }
  .sg-t::before{content:'';width:3px;height:15px;background:#231E1F;border-radius:1px;flex:none}
  .sg-g{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .opt{
    position:relative;background:#fff;border:1px solid #EDEDED;border-radius:8px;
    padding:8px;display:flex;flex-direction:column;align-items:stretch;
    cursor:pointer;overflow:hidden;transition:border-color .12s;
  }
  /* 选中只加内描边，不改变 padding，避免卡片尺寸跳动 */
  .opt.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
  .opt-pic{
    width:100%;aspect-ratio:1.12/1;display:flex;align-items:center;justify-content:center;
    background:#FFFDF8;border-radius:5px;overflow:hidden;
  }
  .opt-pic img{width:100%;height:100%;object-fit:contain}
  .opt-nm{
    margin-top:6px;font-size:12px;line-height:1.34;color:#3D3D3D;text-align:left;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .opt-foot{display:flex;align-items:center;justify-content:space-between;margin-top:5px;height:18px}
  .opt-rd{
    width:18px;height:18px;border-radius:50%;border:1px solid #D6D6D6;background:#fff;
    flex:none;position:relative;
  }
  .opt.on .opt-rd{border-color:var(--primary);background:var(--primary)}
  .opt.on .opt-rd::after{
    content:'';position:absolute;left:6px;top:3px;width:4px;height:8px;
    border:1.7px solid #fff;border-top:0;border-left:0;transform:rotate(42deg);
  }
  .opt-plus{font-size:12px;color:var(--primary);font-weight:600;line-height:18px}
  .opt-cust{
    margin-top:7px;height:26px;border-radius:4px;background:var(--primary);color:#fff;
    font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .opt-badge{
    position:absolute;right:8px;top:8px;font-size:9px;line-height:13px;color:#3FA35A;
    border:1px solid #3FA35A;border-radius:2px;padding:0 3px;background:#fff;
  }
  .opt.sold{opacity:.72}
  .opt.sold .opt-pic img{filter:grayscale(1);opacity:.45}
  .opt-sold{
    position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);
    background:rgba(58,58,58,.78);color:#fff;font-size:10.5px;line-height:1;
    padding:5px 10px;border-radius:3px;white-space:nowrap;
  }
  /* 底部悬浮：黑色条 + 按钮行 */
  .spec-foot{position:absolute;left:0;right:0;bottom:0;padding:8px 0 10px;background:#fff}
  .sf-bar{
    margin:0 11px 9px;height:62px;background:#161616;border-radius:13px;
    display:flex;align-items:center;padding:0 12px;gap:9px;
    box-shadow:0 3px 14px rgba(0,0,0,.16);
  }
  .sf-cnt{
    width:43px;height:43px;border-radius:50%;border:2px solid #565656;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11.5px;flex:none;
  }
  .sf-thumb{
    position:relative;width:43px;height:43px;border:2px solid var(--primary);border-radius:6px;
    background:#fff;flex:none;display:flex;align-items:center;justify-content:center;
  }
  .sf-thumb img{width:100%;height:100%;object-fit:contain;border-radius:4px}
  .sf-thumb .x{
    position:absolute;right:-6px;top:-6px;width:15px;height:15px;border-radius:50%;background:#fff;
    color:#333;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer;
  }
  .sf-qty{display:flex;align-items:center;gap:7px;margin-left:4px;color:#fff;font-size:13px}
  .sf-qty b{cursor:pointer;width:19px;height:19px;border-radius:50%;border:1px solid #6A6A6A;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:400;line-height:1}
  .sf-qty b:active{background:#2E2E2E}
  .sf-close{margin-left:auto;color:#8A8A8A;font-size:17px;cursor:pointer;padding:2px 4px;line-height:1}
  .sf-btn{display:flex;gap:9px;padding:0 11px}
  .sf-reset{
    width:108px;height:48px;background:#fff;border:1px solid var(--primary);color:var(--primary);
    border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:14.5px;cursor:pointer;flex:none;
  }
  .sf-add{
    flex:1;height:48px;border-radius:6px;background:#C4C4C4;color:#fff;font-size:15px;font-weight:500;
    display:flex;align-items:center;justify-content:center;cursor:not-allowed;
  }
  .sf-add.on{background:var(--primary);cursor:pointer}

  /* 底部 tab */
  .tabbar{height:52px;background:#fff;border-top:1px solid var(--line);display:flex;flex:none}
  .tabbar div{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:11px;color:var(--sub);gap:2px;cursor:pointer;
  }
  .tabbar div.on{color:var(--primary)}

  /* 列表卡片 */
  .list{padding:10px 12px;overflow-y:auto;flex:1;scrollbar-width:none}
  .list::-webkit-scrollbar{display:none}
  .card{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px}
  .line{display:flex;align-items:center;gap:8px}
  .muted{color:var(--sub);font-size:12px}
  .hint{color:var(--hint);font-size:11px}
  .divider{height:1px;background:var(--line);margin:8px 0}
  .field{display:flex;align-items:center;margin-top:10px}
  .field label{width:64px;font-size:13px;color:var(--sub);flex:none}
  .field input{
    flex:1;height:38px;border:none;background:#F7F7F7;border-radius:8px;padding:0 10px;
    font-size:13px;font-family:inherit;min-width:0;
  }
  .stepper{display:flex;align-items:center;gap:8px;flex:none}
  .stepper .op{
    width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--text);background:#fff;
  }
  .stepper .op.plusop{background:var(--primary);border-color:var(--primary);color:#fff}
  .stepper .qty{min-width:22px;text-align:center;font-size:14px;font-weight:700}
  .banner{background:var(--primary);color:#fff;padding:20px 12px;text-align:center;flex:none}
  .banner .code{font-size:40px;font-weight:800;letter-spacing:2px;margin-top:6px}
  .banner .st{font-size:20px;font-weight:700}
  .banner .sub{font-size:12px;color:#FFD9DE;margin-top:8px}
  .chips{display:flex;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);flex:none}
  .chips div{
    flex:1;text-align:center;height:30px;line-height:30px;border-radius:15px;font-size:13px;
    color:var(--sub);cursor:pointer;
  }
  .chips div.on{background:var(--primary);color:#fff;font-weight:700}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
  .profile{background:var(--primary);color:#fff;padding:20px 12px;flex:none;display:flex;align-items:center;gap:12px}
  .avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.24);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
  .vip{background:var(--accent);color:#7A4B00;font-size:10px;border-radius:4px;padding:1px 5px;margin-left:8px;font-weight:700}
  .rows{background:#fff;margin-top:10px;flex:none}
  .rows .r{height:50px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
  .rows .r .ic{width:28px;font-size:18px}
  .rows .r .ar{margin-left:auto;color:var(--hint)}
  .pad{padding:0 12px}

  /* 入口页 —— 仿肯德基小程序开屏：整屏肯德基红 + 品牌徽标 + 官方菜品图 + 两张白色入口卡 */
  /* ================= 入口页（仿肯德基小程序首屏） =================
     结构：红色 hero（天际线 + 门店 + 骑手 + 车速取）
           → 三个取餐通道 → 四个功能圆图标 → 会员卡
           → APP热卖/大神卡专区 → 2 列商品 → 两张券 → 深色底部 tab
     顶部四个频道「肯德基 / 肯律轻食 / 肯悦咖啡 / 炸鸡兄弟」，只切高亮，菜单数据不变。 */
  .entry{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#F2F2F2}
  .entry-scroll{flex:1;overflow-y:auto;scrollbar-width:none}
  .entry-scroll::-webkit-scrollbar{display:none}

  /* ---- 1. 红色 hero ---- */
  .ehero{position:relative;overflow:hidden;background:linear-gradient(180deg,#E4002B 0%,#DC0027 58%,#C6001F 100%)}
  .ehero .skyline{position:absolute;left:0;bottom:0;width:100%;height:150px;display:block}
  .ehero .scene{position:relative;display:block;width:100%;height:auto}

  /* ---- 2. 三个取餐通道 ---- */
  .echs{display:flex;background:#fff;height:46px}
  .echs .ch{
    flex:1;display:flex;align-items:center;justify-content:center;
    font-size:14.5px;font-weight:700;color:#1A1A1A;cursor:pointer;letter-spacing:-.3px;
  }
  .echs .ch em{font-style:normal;color:#A8A8A8;font-size:15px;margin-left:2px;font-weight:400}
  .echs .ch:active{opacity:.55}

  /* ---- 3. 四个功能圆图标 ---- */
  .etools{display:flex;background:#fff;padding:2px 4px 12px}
  .etools .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
  .etools .t .ic{
    width:46px;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;
    background:#FFFFFF;box-shadow:0 2px 9px rgba(0,0,0,.10);
  }
  .etools .t span{font-size:10.5px;color:#2B2B2B;letter-spacing:-.2px}
  .etools .t:active{opacity:.6}
  .edots{display:flex;justify-content:center;gap:4px;background:#fff;padding:0 0 9px}
  .edots i{width:5px;height:5px;border-radius:3px;background:#E0E0E0}
  .edots i.on{width:13px;background:#E4002B}

  /* ---- 4. 会员卡 ---- */
  .evipwrap{padding:9px 9px 0;background:#F2F2F2}
  .evip{
    position:relative;background:#fff;border-radius:11px;padding:10px 12px;display:flex;align-items:center;
    overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.045);
  }
  .evip .ava{width:42px;height:42px;border-radius:50%;overflow:hidden;flex:none;background:#FFF4F6}
  .evip .mid{flex:1;min-width:0;margin-left:9px;position:relative;z-index:2}
  .evip .l1{display:flex;align-items:center;gap:5px;font-size:14.5px;font-weight:800;color:#1A1A1A;letter-spacing:-.3px}
  .evip .l1 .tag{
    display:inline-flex;align-items:center;gap:2px;flex:none;
    background:linear-gradient(90deg,#4A4A4A,#222);color:#FFD05B;
    font-size:9.5px;font-weight:700;border-radius:8px;padding:2px 6px;
  }
  .evip .l1 .open{font-size:10.5px;color:#AFAFAF;font-weight:400;flex:none}
  .evip .l2{display:flex;align-items:center;gap:13px;margin-top:6px;font-size:10.5px;color:#9A9A9A}
  .evip .l2 u{text-decoration:none;color:#F0A200;font-size:11px;margin-right:2px}
  .evip .l2 b{color:#1A1A1A;font-size:11.5px;font-weight:700;margin-left:2px}
  .evip .wow{
    position:absolute;right:-4px;bottom:-13px;font-size:42px;font-weight:900;font-style:italic;
    color:#FCEEF1;letter-spacing:-2px;pointer-events:none;line-height:1;
  }

  /* ---- 5. tab ---- */
  .etabs{display:flex;gap:22px;padding:13px 14px 4px;background:#F2F2F2}
  .etabs div{font-size:15.5px;font-weight:700;color:#8E8E8E;cursor:pointer;letter-spacing:-.3px}
  .etabs div.on{color:#1A1A1A;font-weight:800}

  /* ---- 6. 商品 2 列网格 ---- */
  .egrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px 9px 0;background:#F2F2F2}
  .egc{position:relative;background:#fff;border-radius:9px;padding:8px 8px 9px;cursor:pointer;overflow:hidden}
  .egc:active{background:#FCFCFC}
  .egc .bd{
    position:absolute;left:0;top:0;z-index:2;background:#E4002B;color:#fff;
    font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:9px 0 9px 0;letter-spacing:-.2px;
  }
  .egc .pic{height:80px;display:flex;align-items:center;justify-content:center}
  .egc .pic img{max-width:100%;max-height:80px;object-fit:contain;display:block}
  .egc .gn{
    font-size:11.5px;color:#1A1A1A;line-height:1.3;height:30px;overflow:hidden;margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .egc .gp{display:flex;align-items:baseline;gap:3px;margin-top:5px}
  .egc .gp b{color:#E4002B;font-size:15px;font-weight:800;letter-spacing:-.5px}
  .egc .gp b small{font-size:10px;font-weight:700;margin-right:1px}
  .egc .gp em{font-style:normal;font-size:9.5px;color:#E4002B}
  .egc .gp s{color:#B8B8B8;font-size:10.5px;margin-left:auto}

  /* ---- 7. 两张券 ---- */
  .ecps{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px 9px 14px;background:#F2F2F2}
  .ecp{
    position:relative;display:flex;align-items:center;gap:6px;border-radius:9px;padding:11px 8px;
    background:linear-gradient(120deg,#FFF0F3,#FFE6EC);overflow:hidden;
  }
  .ecp.warm{background:linear-gradient(120deg,#FFF7E9,#FFEED6)}
  .ecp .ci{width:34px;height:34px;flex:none}
  .ecp .cw{min-width:0}
  .ecp .ct{font-size:10.5px;color:#4A4A4A;white-space:nowrap;letter-spacing:-.2px}
  .ecp .cv{font-size:14px;font-weight:800;color:#E4002B;margin-top:2px;white-space:nowrap}
  .ecp .cv small{font-size:9.5px;font-weight:700}
  .ecp .cb{
    margin-left:auto;flex:none;width:26px;text-align:center;font-size:9px;line-height:1.3;color:#E4002B;
    border-left:1px dashed rgba(228,0,43,.28);padding:2px 0 2px 5px;
  }

  /* ---- 8. 深色底部 tab（中间 AI 点餐凸起） ---- */
  .etabbar{
    flex:none;position:relative;display:flex;align-items:flex-end;height:60px;
    padding-bottom:5px;background:linear-gradient(180deg,#3C3C3C 0%,#1D1D1D 100%);
  }
  .etabbar .tb{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;
    height:50px;cursor:pointer;position:relative;z-index:2;
  }
  .etabbar .tb span{font-size:9.5px;color:#EDEDED;letter-spacing:-.3px;white-space:nowrap}
  .etabbar .tb.on span{color:#FF5468;font-weight:700}
  .etabbar .tb:active{opacity:.6}
  .etabbar .tb.ai{z-index:3}
  .etabbar .tb.ai .ball{
    position:absolute;left:50%;bottom:15px;transform:translateX(-50%);
    width:54px;height:54px;border-radius:27px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#FF4A62 0%,#E4002B 58%,#BE0022 100%);
    box-shadow:0 0 0 5px rgba(228,0,43,.20),0 6px 14px rgba(0,0,0,.42);
    color:#fff;font-size:24px;font-weight:900;letter-spacing:-1px;
  }
  .etabbar .tb.ai span{margin-top:23px;color:#FF5468;font-weight:700}
  .etabbar .tb .k-logo{font-size:19px;font-weight:900;color:#E4002B;font-style:italic;letter-spacing:-1px;line-height:1}
  .etabbar .tb .wow-logo{font-size:15px;font-weight:900;color:#FFF;font-style:italic;letter-spacing:-.5px;line-height:1}

  /* 搜索结果提示条 */
  .result-bar{
    display:flex;align-items:center;padding:9px 12px;background:#F9F9F9;flex:none;
    border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);
  }
  .result-bar b{color:var(--primary);margin:0 2px}

  /* 矢量图标（内联 SVG，stroke=currentColor 直接继承文字色，不再用 emoji 字体） */
  .ic-svg{display:flex;align-items:center;justify-content:center}
  .tabbar div .ic-svg{height:22px}
  .rows .r .ic{width:28px;display:flex;align-items:center;color:var(--sub)}
  .empty .big{display:flex;align-items:center;justify-content:center;color:var(--hint)}
  /* ================= 顶栏频道条 =================
     红底上一条半透明胶囊（白 20%），选中项是白色胶囊 + 红字；
     右端用 78px 渐隐收到圆钮，暗示还有更多品牌可以横滑。 */
  .echbar{position:relative;height:60px;background:var(--primary);flex:none}
  .echpill{position:absolute;left:16px;right:57px;top:13px;height:34px;border-radius:17px;
    background:rgba(255,255,255,.5);overflow:hidden}
  .echscroll{display:flex;align-items:center;height:100%;padding:0 2px;overflow-x:auto;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,#000 82%,rgba(0,0,0,.3) 95%,transparent 100%);
    mask-image:linear-gradient(90deg,#000 82%,rgba(0,0,0,.3) 95%,transparent 100%)}
  .echscroll::-webkit-scrollbar{display:none}
  .ech{flex:none;display:flex;align-items:center;height:30px;padding:0 13px;color:#fff;
    font-size:13px;white-space:nowrap;cursor:pointer;letter-spacing:-.2px}
  .ech.on{background:#fff;color:var(--primary);border-radius:15px;padding:0 12px;font-weight:700}
  .ech:active{opacity:.7}
  .echmore{position:absolute;right:12px;top:13px;width:34px;height:34px;border-radius:17px;
    background:rgba(255,255,255,.46);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;cursor:pointer}
  .echmore:active{opacity:.65}
  .echmore i{width:15px;height:2px;border-radius:1px;background:#fff;display:block}

  /* ================= WOW 会员中心 ================= */
  .wowpage{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#F4F4F4}
  .wowscroll{flex:1;overflow-y:auto;scrollbar-width:none}
  .wowscroll::-webkit-scrollbar{display:none}
  .wowhead{position:relative;height:250px;overflow:hidden;
    background:linear-gradient(170deg,#EBEBEB 0%,#F4F4F4 100%)}
  .wowhead .fig{position:absolute;right:-4px;bottom:0;width:206px;height:220px;display:block}
  .wowtop{position:absolute;left:0;right:0;top:12px;display:flex;justify-content:flex-end;
    gap:2px;padding:0 10px}
  .wowtop .ic{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    color:#4E4E4E;position:relative;cursor:pointer}
  .wowtop .ic .dot{position:absolute;right:6px;top:4px;width:6px;height:6px;border-radius:3px;background:#E4002B}
  .wowpill{position:absolute;left:18px;top:76px;display:inline-flex;align-items:center;
    height:34px;padding:0 14px;border-radius:17px;background:#FFE6EC;color:#C8304E;
    font-size:12.5px;font-weight:700;cursor:pointer;letter-spacing:-.2px}
  .wowpill .ar{margin-left:5px;font-size:14px;font-weight:400}
  .wowname{position:absolute;left:18px;bottom:44px;display:flex;align-items:center;gap:8px}
  .wowname .n{font-size:19px;font-weight:800;color:#1A1A1A;letter-spacing:-.4px}
  .wowname .tag{background:#1F1F1F;color:#FF7A8C;font-size:9.5px;font-weight:700;
    padding:2.5px 6px;border-radius:3px;letter-spacing:.3px}
  .wowno{position:absolute;left:18px;bottom:24px;font-size:10.5px;color:#A0A0A0}
  .wowstats{display:flex;background:#fff;border-radius:12px;margin:0 12px;padding:14px 0;
    box-shadow:0 2px 10px rgba(0,0,0,.04)}
  .wowstats .s{flex:1;text-align:center;position:relative}

  .wowstats .v{font-size:17px;font-weight:800;color:#1A1A1A}
  .wowstats .k{font-size:10.5px;color:#9A9A9A;margin-top:4px}
  .wowacts{display:flex;background:#fff;border-radius:12px;margin:10px 12px 0;padding:16px 0 14px}
  .wowacts .a{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;
    cursor:pointer;color:#E4002B}
  .wowacts .a span{font-size:11px;color:#4A4A4A}
  .wowacts .a:active{opacity:.6}
  .wowcards{margin:16px 12px 0}
  .wowcards .stack{position:relative}
  .wowcards .c-mini{height:56px;border-radius:12px;background:#FFF1F4;border:1px solid #FFDCE3;

  .wowcards .c-main{position:relative;margin-top:-18px;border-radius:12px;padding:15px 16px 16px;
    color:#fff;background:linear-gradient(135deg,#EF0038 0%,#C50023 62%,#A8001D 100%);

  .wowcards .cm-top{display:flex;align-items:flex-start;justify-content:space-between}
  .wowcards .cm-name{font-size:15px;font-weight:800;letter-spacing:-.2px}
  .wowcards .cm-sub{font-size:10.5px;color:rgba(255,255,255,.78);margin-top:5px}
  .wowcards .cm-open{background:#fff;color:#D4001F;font-size:11px;font-weight:700;
    padding:5px 11px;border-radius:12px}
  .wowcards .cm-benefits{display:flex;margin-top:14px;padding-top:13px;

  .wowcards .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
  .wowcards .b b{font-size:13px;font-weight:800;color:#FFD05B}
  .wowcards .b span{font-size:9.5px;color:rgba(255,255,255,.86)}

  /* ================= 大神卡（付费会员） ================= */

  这个页面跑在 Spring Boot 的静态资源里，和接口同源，用来在没有模拟器/真机时<br>
  验证「鸿蒙端界面 + 后端 CRUD」这条链路。数据都是真实接口返回的。<br>
  接口地址 <code id="apiBase"></code> 　后端状态 <code id="health">检测中…</code>
</div>

document.getElementById('apiBase').textContent = location.origin + '/api';

async function api(path, method, body) {
  const headers = { 'Content-Type': 'application/json' };
  // 与鸿蒙端一致：登录后所有请求自动带 Authorization
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch('/api' + path, {
    method: method || 'GET',
    headers: headers,
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  const json = await res.json();
  if (json.code !== 200) throw new Error(json.message || ('HTTP ' + res.status));
  return json.data;
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function money(n) { return Number(n).toFixed(2); }
/* 餐品图：后端 image 存的是 /images/products/xxx 相对路径，同源页面直接可用 */
function thumbHtml(img, size, fit) {
  const s = size || 78;
  const f = fit || 'cover';
  if (!img) {
    return '<div class="thumb" style="width:' + s + 'px;height:' + s + 'px"></div>';
  }
  return '<img class="thumb" style="width:' + s + 'px;height:' + s + 'px;object-fit:' + f + ';background:#fff" src="' + esc(img) + '" alt="">';
}
/** 点餐页的大图：宽度固定 194，高度按原图比例走（官方运营图是宽幅 banner，不能压成正方形） */
function prodThumb(img) {
  if (!img) return '<div class="thumb pthumb"></div>';
  return '<img class="thumb pthumb" src="' + esc(img) + '" alt="">';
}
function dt(iso) {
  if (!iso) return '';
  const d = new Date(iso.replace(/\.(\d{3})\d+/, '.$1'));
  if (isNaN(d.getTime())) return iso;
  const p = n => (n < 10 ? '0' + n : '' + n);
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ============================ 数据动作 ============================ */
async function loadMenu() {
  state.categories = await api('/categories');
}

/** 入口页 hero 图：优先用「肉霸堡双人餐」的官方图，菜单变了就退回第一张有图的餐品 */
const HERO_IMAGE = '/images/products/100129693.jpg';
function heroPick() {
  const all = state.categories.flatMap(c => c.products);
  const hit = all.find(p => p.image === HERO_IMAGE);
  if (hit) return hit;
  return all.find(p => p.image) || { image: HERO_IMAGE, name: '肉霸堡双人餐' };
}

/* 关键词搜索：停顿 300ms 才发请求，避免每敲一个字都打一次接口 */
let searchTimer = null;
function scheduleSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 300);
}
async function runSearch() {
  const kw = state.keyword.trim();
  if (!kw) {
    state.searchResults = [];
    state.searching = false;
    render();
    return;
  }
  state.searching = true;
  render();
  try {
    state.searchResults = await api('/products/search?keyword=' + encodeURIComponent(kw));
  } catch (e) {
    state.searchResults = [];
    toast(e.message);
  }
  state.searching = false;
  render();
}
function clearKeyword() {
  state.keyword = '';
  state.searchResults = [];
  state.searching = false;
  state.searchFocus = true;
  render();
}
async function loadCart() {
  if (!state.userId) {
    state.cartItems = []; state.cartCount = 0; state.cartAmount = 0; state.quote = null;
    return;
  }
  state.cartItems = await api('/cart-items?userId=' + state.userId);
  const s = await api('/cart-items/summary?userId=' + state.userId);
  state.cartCount = s.count;
  state.cartAmount = Number(s.amount);
  // 结算试算：只读接口，失败不影响购物车本身
  try {
    state.quote = state.cartItems.length
      ? await api('/orders/quote?userId=' + state.userId + '&pickupType=PICKUP')
      : null;
  } catch (e) {
    state.quote = null;
  }
}

/** 应付金额：有优惠时用服务端算的，没有就用购物车合计 */
function cartPayAmount() {
  const q = state.quote;
  return q && Number(q.discountAmount) > 0 ? Number(q.payAmount) : state.cartAmount;
}

/** 优惠文案，如「大神卡 季卡已省 ¥9.00」 */
function cartBenefitText() {
  const q = state.quote;
  if (!q || !Number(q.discountAmount)) return '';
  return q.benefitText || ('已省 ¥' + money(q.discountAmount));
}
async function loadOrders() {
  if (!state.userId) { state.orders = []; return; }
  state.orders = await api('/orders?userId=' + state.userId);
}
async function loadAddresses() {
  if (!state.userId) { state.addresses = []; return; }
  state.addresses = await api('/addresses?userId=' + state.userId);
}
async function loadMember() {
  if (!state.userId) { state.member = null; return; }
  try {
    state.member = await api('/member/summary?userId=' + state.userId);
  } catch (e) {
    state.member = null;
  }
}
async function login(username, password) {
  const user = await api('/users/login', 'POST', { username, password });
  state.token = user.token;
  state.userId = user.id;
  state.user = user;
  await loadCart();
  await loadMember();
  await loadPlans('大神卡');
  await loadPlans('咖啡卡');
  return user;
}
async function addToCart(product, qty) {
  if (!state.userId) { toast('请先登录'); go('login'); return; }
  const quantity = Math.max(1, Number(qty) || 1);
  try {
    await api('/cart-items', 'POST', { userId: state.userId, productId: product.id, quantity });
    await loadCart();
    toast('已加入 ' + product.name + (quantity > 1 ? ' ×' + quantity : ''));
    if (state.view !== 'spec') render();
  } catch (e) { toast(e.message); }
}

/* ============================ 视图切换 ============================ */
function go(view) {
  state.view = view;
  // 离开点餐页就别再把焦点塞回搜索框
  if (view !== 'menu') state.searchFocus = false;
  // 回首页时把搜索状态清干净，否则再从入口进来会停在搜索结果上
  if (view === 'entry') {
    state.keyword = '';
    state.searchResults = [];
    state.searching = false;
  }
  if (view === 'cart') loadCart().then(render).catch(e => toast(e.message));
  if (view === 'orders') loadOrders().then(render).catch(e => toast(e.message));
  if (view === 'address') loadAddresses().then(render).catch(e => toast(e.message));
  // AI 点餐：只有第一次进（或上次失败）才真去调模型，来回切 tab 不重复计费
  if (view === 'ai' && (!state.ai || state.aiError)) loadAi('');
  if (view === 'mine' && state.userId) {
    api('/users/' + state.userId).then(u => { state.user = u; render(); }).catch(() => {});
  }
  render();
}

/* ============================ 渲染 ============================ */
function render() {
  const screen = document.getElementById('screen');
  const views = {
    entry: viewEntry, menu: viewMenu, cart: viewCart, orders: viewOrders,
    orderDetail: viewOrderDetail, address: viewAddress, mine: viewMine, login: viewLogin,
    wow: viewWow, memberCard: viewMemberCard, ai: viewAi, spec: viewSpec
  };
  screen.innerHTML = (views[state.view] || viewEntry)();
  // 点餐页顶栏是浅色分层，状态条跟着变浅；其余页面（入口页红色 hero 等）保持红底
  const sb = document.querySelector('.statusbar');
  if (sb) sb.classList.toggle('light', state.view === 'menu' || state.view === 'spec');
  bind();
}

/* 从真实菜单里挑一款陈列品：按关键词命中，都不中就用第 idx 个有图的
   used 里是已占用的**餐品名** —— 四个陈列位必须是四款不同餐品。
   注意不能按 id 去重：真实菜单里同一款会挂在两个分类下
   （如「四味小食拼盘」在人气热卖 id=27、炸鸡小食 id=42），
   按 id 去重挡不住，页面上会并排出现两张一模一样的卡。 */
function cfPick(keys, idx, used) {
  const all = state.categories.flatMap(c => c.products).filter(p => p.image);
  if (!all.length) return null;
  const free = all.filter(p => !used || !used.has(p.name));
  const pool = free.length ? free : all;
  for (let i = 0; i < keys.length; i++) {
    const hit = pool.find(p => p.name.indexOf(keys[i]) >= 0);
    if (hit) return hit;
  }
  return pool[idx % pool.length];
}

function catLines(name) {
  const n = String(name || '').replace(/\s/g, '');
  if (n.length <= 2) return [n];
  if (n.length <= 5) return [n.slice(0, 2), n.slice(2)];
  return [n.slice(0, 3), n.slice(3, 6)];
}

/* ---------- 规格选择页 ----------
   后端暂时没有 SKU 表（t_product 只有单价格），这里按品类造 2~3 个分组的演示选项；
   等接入真 SKU（t_product_group / item）后，把 specGroups() 的返回值换成接口数据即可，
   本页的渲染与交互都不用动。 */

/** 名称归一化：去括号内容、去空白，用于规格选项与真实餐品的模糊对应 */
function normName(s) {
  return String(s || '')
    .replace(/[（(][^）)]*[）)]/g, '')
    .replace(/[\s·、,，/]/g, '');
}

/**
 * 按名称在菜单里找最像的那道菜的图。
 * 命中不了就回落 fallback（例如「中杯 / 少冰 / 无糖」这类纯规格项，本来就该用主商品的图）。
 */
function imgOf(name, fallback) {
  if (!name) return fallback;
  const key = normName(name);
  if (!key) return fallback;
  let best = '', bestScore = 0;
  state.categories.forEach(c => (c.products || []).forEach(pr => {
    if (!pr.image) return;
    const pn = normName(pr.name);
    if (!pn) return;
    let score = 0;
    if (pn === key) score = 100;
    else if (pn.startsWith(key) || key.startsWith(pn)) score = 70 + Math.min(pn.length, key.length);
    else if (pn.includes(key) || key.includes(pn)) score = 40 + Math.min(pn.length, key.length);
    if (score > bestScore) { bestScore = score; best = pr.image; }
  }));
  return bestScore >= 43 ? best : fallback;
}

    return [

        { id: 'c', name: '香辣鸡翅(2块)', add: 2, img: '香辣鸡翅' }] },
      { id: 'drink', name: '饮料', items: [
        { id: 'a', name: '百事可乐(中)', add: 0, img: '百事可乐', cust: true },

/* ==================== 大神卡（付费会员） ==================== */
/** 接口拿不到时的兜底档位（与 V4__member.sql 种子一致） */
const FALLBACK_GOD_PLANS = [
  { code: 'GOD_SEASON', name: '季卡', price: 30, originPrice: 38, days: 90, privilegeNum: 11 },
  { code: 'GOD_YEAR', name: '年卡', price: 100, originPrice: 108, days: 365, privilegeNum: 11 },
  { code: 'GOD_MONTH', name: '月卡', price: 19, originPrice: 25, days: 30, privilegeNum: 11 }
];
const FALLBACK_CF_PLANS = [
  { code: 'COFFEE_30', name: '咖啡卡 · 30天', price: 12, originPrice: 15, days: 30, privilegeNum: 8 }
];

/** 当前 tab 的档位：优先接口，其次兜底 */
function plansFor(tab) {
  const got = state.plans ? state.plans[tab] : null;
  if (got && got.length) return got;
  return tab === '大神卡' ? FALLBACK_GOD_PLANS : FALLBACK_CF_PLANS;
}

/** 价格显示：去掉多余的 .00 */
function money(v) {
  const n = Number(v);
  return Number.isInteger(n) ? String(n) : n.toFixed(2);
}

async function loadPlans(tab) {
  try {
    const type = tab === '大神卡' ? 'GOD' : 'COFFEE';
    const list = await api('/member/plans?cardType=' + type);
    if (!state.plans) state.plans = {};
    state.plans[tab] = list;
  } catch (e) {
    if (state.plans) state.plans[tab] = null;
  }
}

/** 开通 / 续费：与鸿蒙端同一条接口 */
async function buyCard() {
  if (!state.userId) { toast('请先登录再开通'); go('login'); return; }
  const plans = plansFor(state.cardTab);
  const plan = plans[state.cardPlan] || plans[0];
  if (!plan) { toast('套餐加载失败'); return; }
  const wasHolding = !!(state.member && (state.member.cards || []).some(
    c => c.cardType === (state.cardTab === '大神卡' ? 'GOD' : 'COFFEE')));
  try {

/* ============================ AI 点餐 ============================ */
/** 现价：整数不带小数，非整数留一位 */
function aiPrice(p) {
  const n = Number(p.price);
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}
/** 划线原价，仅当确实高于现价时返回，否则空串 */
function aiOrigin(p) {
  const o = Number(p.originPrice);
  if (!(o > Number(p.price))) return '';
  return Number.isInteger(o) ? String(o) : o.toFixed(1);
}

/**
 * 要一组推荐
 *
 * 后端拿到的是真实菜单，模型只负责「挑哪几样 + 说一句话」，
 * 图片/价格/会员价全部回表补，所以这里拿到的每张卡都能直接加购。
 */
async function loadAi(message) {
  state.aiLoading = true;
  state.aiError = '';
  render();
  try {
    state.ai = await api('/ai/recommend', 'POST', {
      message: message || '',
      pickupType: state.pickupType,
      count: 6
    });
  } catch (e) {
    state.aiError = e.message || '推荐失败，请稍后重试';
    state.ai = null;
  }
  state.aiLoading = false;
  render();
}

function aiSkeleton() {
  let cells = '';
  for (let i = 0; i < 6; i++) cells += '<div class="aipick sk"></div>';
  return '<div class="aicard"><div class="ailoading"><span class="dot"></span>小K 正在翻菜单…</div>'
    + '<div class="aigrid">' + cells + '</div></div>';
}

function aiPickCell(it) {
  const p = it.product || {};
  const img = p.image
    ? '<img src="' + esc(p.image) + '" alt="">'
    : ICON.burger;
  const org = aiOrigin(p);
  return '<div class="aipick" data-aipick="' + p.id + '">'
    + '<div class="imgwrap">' + img + '<span class="sel">' + esc(it.label) + '</span></div>'
    + '<div class="nm">' + esc(p.name) + '</div>'
    + '<div class="pr"><small>¥</small><b>' + aiPrice(p) + '</b><u>起</u></div>'
    + '<div class="org">' + (org ? '¥' + org : '') + '</div>'
    + '</div>';
}

/**
 * 纯文字推荐清单
 *
 * 先文字后图片：编号 → 菜名 + 理由 → 价格，末尾小计。
 * 让用户不点图也能判断「够不够吃、合不合口味」，图网格留在下面负责加购。
 */
function aiTextList(items) {
  let rows = '';
  let sum = 0;
  items.forEach(it => {
    const p = it.product || {};
    sum += Number(p.price || 0);
    rows += '<div class="aitxt-item">'
      + '<div class="aitxt-no">' + it.index + '</div>'
      + '<div class="aitxt-main">'
      + '<div class="aitxt-nm">' + esc(p.name) + '</div>'
      + '<div class="aitxt-rs">' + esc(it.reason || '') + '</div>'
      + '</div>'
      + '<div class="aitxt-pr">¥' + aiPrice(p) + '</div>'
      + '</div>';
  });
  return '<div class="aitxt">' + rows
    + '<div class="aitxt-sum">小计 ¥' + sum.toFixed(2) + '　共 ' + items.length + ' 件</div></div>';
}

/* ============================ 事件绑定 ============================ */
function bind() {
  const screen = document.getElementById('screen');

  // 点分类 → 右侧滚动
  screen.querySelectorAll('[data-cat]').forEach(el => {
    el.onclick = () => {
      const i = Number(el.dataset.cat);
      state.activeCategory = i;
      const sec = screen.querySelector(`[data-sec="${i}"]`);
      const list = document.getElementById('products');
      if (sec && list) list.scrollTop = sec.offsetTop;
      render();
      // 重新渲染后把滚动位置补回去
      const list2 = document.getElementById('products');
      const sec2 = screen.querySelector(`[data-sec="${i}"]`);
      if (list2 && sec2) list2.scrollTop = sec2.offsetTop;
    };
  });

  // 右侧滚动 → 左侧高亮
  const products = document.getElementById('products');
  if (products) {
    products.onscroll = () => {
      const secs = screen.querySelectorAll('[data-sec]');
      let idx = 0;
      secs.forEach((s, i) => { if (s.offsetTop - products.scrollTop <= 8) idx = i; });
      if (idx !== state.activeCategory) {
        state.activeCategory = idx;
        screen.querySelectorAll('[data-cat]').forEach((el, i) => el.classList.toggle('on', i === idx));
      }
    };
  }

  screen.querySelectorAll('[data-add]').forEach(el => {
    el.onclick = () => {
      const p = state.categories.flatMap(c => c.products).find(x => x.id === Number(el.dataset.add));
      if (!p) return;
      // 有可选规格的走规格页（官方「选规格」），纯加购品直接进车
      if (hasSpec(p) && Number(p.stock) > 0) openSpec(p); else addToCart(p);
    };
  });

  // 规格页：选项、数量、重置、加入购物车、关闭
  screen.querySelectorAll('[data-opt]').forEach(el => {
    el.onclick = () => {
      const [gid, iid] = el.dataset.opt.split(':');
      state.specSel[gid] = iid;
      render();
    };
  });
  screen.querySelectorAll('[data-qty]').forEach(el => {
    el.onclick = () => {
      const d = Number(el.dataset.qty);
      state.specQty = Math.min(99, Math.max(1, state.specQty + d));
      render();
    };
  });

  // 搜索框：输入即搜（300ms 防抖）
  const kw = document.getElementById('kw');
  if (kw) {
    kw.oninput = () => {
      state.keyword = kw.value;
      state.searchFocus = true;
      scheduleSearch();
    };
    // 整页 innerHTML 重绘会把 input 换掉，所以重绘后要把焦点和光标位置还回去，
    // 否则连续打字打到第二个字就掉焦点了
    if (state.searchFocus) {
      kw.focus();
      const n = kw.value.length;
      try { kw.setSelectionRange(n, n); } catch (e) { /* 个别环境不支持，忽略即可 */ }
    }
  }

  // 入口页的三个取餐通道 + 4 张陈列位：都进同一个点餐页，只把取餐方式记下来
  screen.querySelectorAll('[data-entry]').forEach(el => {
    el.onclick = () => {
      state.pickupType = el.dataset.entry || 'PICKUP';
      state.view = 'menu';
      state.searchFocus = false;
      render();
    };
  });

  // 顶栏频道条：只切高亮 + 把选中项滚到可视区中间
  screen.querySelectorAll('[data-ech]').forEach(el => {
    el.onclick = () => {
      state.channel = el.dataset.ech;
      render();
      const cur = document.querySelector('.ech.on');
      if (cur) cur.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
      if (state.channel !== '肯德基') toast(state.channel + ' 频道菜单正在接入，当前展示肯德基菜单');
    };
  });
  screen.querySelectorAll('[data-echmore]').forEach(el => {
    el.onclick = () => toast('全部分类：肯德基 / 肯律轻食 / 肯悦咖啡 / 炸鸡兄弟');
  });

  // 底部 5 tab：大神卡 / 会员中心 接真实页面，首页回入口页，其余保持占位
  screen.querySelectorAll('[data-egoto]').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.egoto;
      if (k === 'card') { go('memberCard'); return; }
      if (k === 'wow') { go('wow'); return; }
      if (k === 'home') { go('entry'); return; }
      if (k === 'ai') { go('ai'); return; }
      toast('百胜出品：功能陆续开放');
    };
  });

  // 大神卡页：大神卡 / 咖啡卡 切 tab、三档套餐切换
  screen.querySelectorAll('[data-cardtab]').forEach(el => {
    el.onclick = async () => {
      if (state.cardTab === el.dataset.cardtab) return;
      state.cardTab = el.dataset.cardtab;
      state.cardPlan = 0;
      await loadPlans(state.cardTab);
      render();
    };
  });
  screen.querySelectorAll('[data-plan]').forEach(el => {
    el.onclick = () => { state.cardPlan = Number(el.dataset.plan); render(); };
  });
  screen.querySelectorAll('[data-buy]').forEach(el => {
    el.onclick = () => buyCard();
  });

  // 入口页其余入口（功能图标 / 会员卡 / 券）：只做外观，点了给提示
  screen.querySelectorAll('[data-etool]').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.etool;
      if (k === '大神卡') { go('memberCard'); return; }
      toast(k + '：功能陆续开放');
    };
  });

  // APP热卖 / 大神卡专区 切换
  screen.querySelectorAll('[data-ecf]').forEach(el => {
    el.onclick = () => {
      state.entryTab = el.dataset.ecf;
      render();
    };
  });

  screen.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => go(el.dataset.tab);
  });

  // AI 点餐：返回 / 换一换 / 新对话 / 文字输入 / 点卡加购
  screen.querySelectorAll('[data-aigoto]').forEach(el => {
    el.onclick = () => go('entry');
  });
  screen.querySelectorAll('[data-aivoice]').forEach(el => {
    el.onclick = () => toast('语音播报暂未接入，先看文字吧');
  });
  screen.querySelectorAll('[data-airefresh]').forEach(el => {
    el.onclick = () => loadAi('换一换');
  });
  screen.querySelectorAll('[data-ainew]').forEach(el => {
    el.onclick = () => { state.aiDraft = ''; loadAi(''); };
  });
  // 发送：空串不发（模型对着空话也只能再给一份热门，白等 3 秒）
  const aiSend = () => {
    const input = document.getElementById('ai-draft');
    const text = input ? input.value.trim() : '';
    if (!text || state.aiLoading) {
      if (!text) toast('先说说你想吃什么');
      return;
    }
    state.aiDraft = '';
    loadAi(text);
  };
  screen.querySelectorAll('[data-aisend]').forEach(el => { el.onclick = aiSend; });
  const aiDraftEl = document.getElementById('ai-draft');
  if (aiDraftEl) {
    // 只记状态、不重绘，否则每敲一个字输入框都会重建、光标跳回开头
    aiDraftEl.oninput = () => {
      state.aiDraft = aiDraftEl.value;
      const btn = document.querySelector('[data-aisend]');
      if (btn) btn.classList.toggle('off', !state.aiDraft.trim());
    };
    aiDraftEl.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); aiSend(); }
    };
  }
  screen.querySelectorAll('[data-aipick]').forEach(el => {
    el.onclick = () => {
      const list = state.ai && state.ai.items ? state.ai.items : [];
      const hit = list.find(x => x.product.id === Number(el.dataset.aipick));
      if (hit) addToCart(hit.product);
    };
  });

  screen.querySelectorAll('[data-back]').forEach(el => {
    el.onclick = () => go(el.dataset.back);
  });

  const remark = document.getElementById('remark');
  if (remark) remark.oninput = () => { state.remark = remark.value; };

  // 购物车加减
  screen.querySelectorAll('[data-cart-minus]').forEach(el => {
    el.onclick = async () => {
      const id = Number(el.dataset.cartMinus);
      const item = state.cartItems.find(x => x.id === id);
      if (!item) return;
      try {
        if (item.quantity - 1 <= 0) await api('/cart-items/' + id + '?userId=' + state.userId, 'DELETE');
        else await api('/cart-items/' + id, 'PUT', { quantity: item.quantity - 1 });
        await loadCart(); render();
      } catch (e) { toast(e.message); }
    };
  });
  screen.querySelectorAll('[data-cart-plus]').forEach(el => {
    el.onclick = async () => {
      const id = Number(el.dataset.cartPlus);
      const item = state.cartItems.find(x => x.id === id);
      if (!item) return;
      try {
        await api('/cart-items/' + id, 'PUT', { quantity: item.quantity + 1 });
        await loadCart(); render();
      } catch (e) { toast(e.message); }
    };
  });

  screen.querySelectorAll('[data-act]').forEach(el => {
    el.onclick = () => runAct(el.dataset.act);
  });

  screen.querySelectorAll('[data-pay]').forEach(el => { el.onclick = () => payOrder(Number(el.dataset.pay)); });
  screen.querySelectorAll('[data-cancel]').forEach(el => { el.onclick = () => cancelOrder(Number(el.dataset.cancel)); });
  screen.querySelectorAll('[data-detail]').forEach(el => { el.onclick = () => openDetail(Number(el.dataset.detail)); });
  screen.querySelectorAll('[data-filter]').forEach(el => {
    el.onclick = () => { state.orderFilter = el.dataset.filter; render(); };
  });
  screen.querySelectorAll('[data-set-default]').forEach(el => {
    el.onclick = () => setDefaultAddress(Number(el.dataset.setDefault));
  });
  screen.querySelectorAll('[data-del-address]').forEach(el => {
    el.onclick = () => removeAddress(Number(el.dataset.delAddress));
  });

  // 表单字段（实时回填到 state，渲染时不丢）
  const grab = (id, apply) => { const e = document.getElementById(id); if (e) e.oninput = () => apply(e.value); };
  grab('f-receiver', v => state.addressForm.receiver = v);
  grab('f-phone', v => state.addressForm.phone = v);
  grab('f-province', v => state.addressForm.province = v);
  grab('f-city', v => state.addressForm.city = v);
  grab('f-district', v => state.addressForm.district = v);
  grab('f-detail', v => state.addressForm.detail = v);
  const def = document.getElementById('f-default');
  if (def) def.onchange = () => { state.addressForm.isDefault = def.checked; };
  grab('l-username', v => state.loginForm.username = v);
  grab('l-password', v => state.loginForm.password = v);
  grab('l-nickname', v => state.loginForm.nickname = v);
  grab('l-phone', v => state.loginForm.phone = v);
}

async function runAct(act) {
  try {
    if (act === 'go-cart') {
      if (state.cartCount > 0) go('cart'); else toast('先挑点吃的吧');
    } else if (act === 'back-home') {
      go('entry');
    } else if (act === 'clear-keyword') {
      clearKeyword();
    } else if (act === 'book') {
      toast('预约点餐暂未开放');
    } else if (act === 'helper') {
      toast('优惠助手暂未接入');
    } else if (act === 'card-tab') {
      go('memberCard');
    } else if (act === 'reload-menu') {
      await loadMenu(); render();
    } else if (act === 'reload-orders') {
      await loadOrders(); render(); toast('已刷新');
    } else if (act === 'reload-order') {
      state.currentOrder = await api('/orders/' + state.currentOrder.id); render();
    } else if (act === 'clear-cart') {
      await api('/cart-items?userId=' + state.userId, 'DELETE');
      await loadCart(); render(); toast('购物车已清空');
    } else if (act === 'spec-reset') {
      state.specSel = {}; state.specQty = 1; render();
    } else if (act === 'spec-close') {
      go('menu');
    } else if (act === 'spec-cust') {
      toast('定制口味暂未接入');
    } else if (act === 'spec-add') {
      const sp = state.specProduct;
      if (!sp) return;
      const gs = specGroups(sp);
      if (gs.some(g => !state.specSel[g.id])) { toast('请先选完规格'); return; }
      const qty = state.specQty;
      state.specProduct = null;
      await addToCart(sp, qty);
      go('menu');
    } else if (act === 'checkout') {
      await checkout();
    } else if (act === 'demo-login') {
      const u = await login(DEMO.username, DEMO.password);
      toast('已登录 ' + (u.nickname || u.username));
      await loadMenu(); render();
    } else if (act === 'logout') {
      state.userId = 0; state.user = null; state.cartItems = []; state.cartCount = 0; state.cartAmount = 0;
      toast('已退出登录'); render();
    } else if (act === 'toggle-login-mode') {
      state.loginMode = state.loginMode === 'LOGIN' ? 'REGISTER' : 'LOGIN'; render();
    } else if (act === 'submit-login') {
      await submitLogin();
    } else if (act === 'save-address') {
      await saveAddress();
    }
  } catch (e) { toast(e.message); }
}

async function submitLogin() {
  const lf = state.loginForm;
  if (!lf.username || !lf.password) { toast('账号和密码都要填'); return; }
  if (state.loginMode === 'LOGIN') {
    const u = await login(lf.username, lf.password);
    toast('登录成功，欢迎 ' + (u.nickname || u.username));
  } else {
    const u = await api('/users/register', 'POST', {
      username: lf.username, password: lf.password, phone: lf.phone, nickname: lf.nickname
    });
    state.userId = u.id; state.user = u;
    await loadCart();
    toast('注册成功，欢迎 ' + (u.nickname || u.username));
  }
  await loadMenu();
  go('menu');
}

async function payOrder(id) {
  try {
    const o = await api('/orders/' + id + '/pay', 'POST', {});
    toast('支付成功，取餐码 ' + o.pickupCode);
    if (state.view === 'orderDetail') state.currentOrder = o;
    await loadOrders();
    render();
  } catch (e) { toast(e.message); }
}

async function cancelOrder(id) {
  try {
    const o = await api('/orders/' + id + '/cancel', 'POST', {});
    toast('订单已取消');
    if (state.view === 'orderDetail') state.currentOrder = o;
    await loadOrders();
    render();
  } catch (e) { toast(e.message); }
}

async function openDetail(id) {
  try {
    state.currentOrder = await api('/orders/' + id);
    state.view = 'orderDetail';
    render();
  } catch (e) { toast(e.message); }
}

async function checkout() {
  if (!state.userId) { toast('请先登录'); go('login'); return; }
  if (!state.cartItems.length) { toast('购物车是空的'); return; }
  // 下单 → 支付（演示环境没接真实支付，下单后直接调支付拿取餐码）
  // pickupType 仍写死 PICKUP：入口页的外送 / 到店自取只做外观区分，不参与业务
  const order = await api('/orders', 'POST', {
    userId: state.userId, pickupType: 'PICKUP', remark: state.remark
  });
  const paid = await api('/orders/' + order.id + '/pay', 'POST', {});
  state.remark = '';
  await loadCart();
  await loadOrders();
  state.currentOrder = paid;
  state.view = 'orderDetail';
  render();
  toast('支付成功，取餐码 ' + paid.pickupCode);
}

async function saveAddress() {
  const f = state.addressForm;
  if (!f.receiver || !f.phone || !f.detail) { toast('收货人、手机号、详细地址都要填'); return; }
  await api('/addresses', 'POST', {
    userId: state.userId, receiver: f.receiver, phone: f.phone,
    province: f.province, city: f.city, district: f.district, detail: f.detail, isDefault: f.isDefault
  });
  state.addressForm.detail = '';
  toast('地址已保存');
  await loadAddresses();
  render();
}

async function setDefaultAddress(id) {
  const a = state.addresses.find(x => x.id === id);
  if (!a) return;
  try {
    await api('/addresses/' + id, 'PUT', {
      userId: a.userId, receiver: a.receiver, phone: a.phone,
      province: a.province, city: a.city, district: a.district, detail: a.detail, isDefault: true
    });
    await loadAddresses(); render(); toast('已设为默认地址');
  } catch (e) { toast(e.message); }
}

async function removeAddress(id) {
  try {
    await api('/addresses/' + id + '?userId=' + state.userId, 'DELETE');
    await loadAddresses(); render(); toast('已删除');
  } catch (e) { toast(e.message); }
}

/* ============================ 启动 ============================ */
function tickClock() {
  const d = new Date();
  const p = n => (n < 10 ? '0' + n : '' + n);
  document.getElementById('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes());
}
setInterval(tickClock, 20000);
tickClock();

(async function boot() {
  const health = document.getElementById('health');
  try {
    await loadMenu();
    health.textContent = '已连接（' + state.categories.length + ' 个分类）';
  } catch (e) {
    health.textContent = '连不上：' + e.message;
  }
  // 和其他端保持一致：默认用演示账号自动登录，省掉每次手动登录
  try {
    if (!state.userId) {
      await login(DEMO.username, DEMO.password);
      await loadMenu();
    }
  } catch (e) {
    console.warn('自动登录失败', e);
  }
  render();
})();
</script>
</body>
</html>
