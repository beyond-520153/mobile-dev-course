<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KFC 点餐 · 前后端联调预览</title>
<style>
  :root{
    --primary:#E4002B; --primary-dark:#C10023; --accent:#FFC72C;
    --bg:#F5F5F5; --card:#FFFFFF; --sidebar:#F7F7F7;
    --text:#1A1A1A; --sub:#8A8A8A; --hint:#B5B5B5; --line:#EFEFEF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:#E9EBEE;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);display:flex;flex-direction:column;align-items:center;padding:18px 12px 40px;
  }
  .page-title{font-size:15px;font-weight:700;color:#333}
  .page-hint{font-size:12px;color:#777;margin-top:6px;text-align:center;line-height:1.7}
  .page-hint code{background:#fff;border-radius:4px;padding:1px 5px;font-size:11px}

  /* 手机外壳 */
  .phone{
    width:390px;max-width:100%;height:780px;margin-top:14px;background:var(--bg);
    border-radius:26px;border:8px solid #22262B;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 18px 40px rgba(0,0,0,.22);position:relative;
  }
  .statusbar{
    height:26px;background:var(--primary);color:#fff;font-size:11px;
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex:none;
  }
  .screen{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}

  /* 通用 */
  .navbar{
    height:46px;background:#fff;display:flex;align-items:center;flex:none;
    border-bottom:1px solid var(--line);padding:0 6px;
  }
  .navbar .back{width:40px;font-size:22px;text-align:center;cursor:pointer;color:var(--text)}
  .navbar .title{flex:1;text-align:center;font-size:16px;font-weight:700}
  .navbar .act{width:50px;text-align:center;font-size:13px;color:var(--primary);cursor:pointer}
  .toast{
    position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(0,0,0,.78);
    color:#fff;font-size:12px;padding:8px 14px;border-radius:16px;opacity:0;transition:opacity .22s;
    pointer-events:none;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis;z-index:50;
  }
  .toast.show{opacity:1}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--sub);font-size:13px;gap:10px}
  .empty .big{font-size:44px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 16px;
    border-radius:17px;background:var(--primary);color:#fff;font-size:13px;font-weight:700;
    border:none;cursor:pointer;font-family:inherit;
  }
  .btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
  .btn.gray{background:#fff;color:var(--sub);border:1px solid var(--line)}
  .btn:disabled{background:#D0D0D0;cursor:not-allowed}

  /* 顶部取餐方式栏 */
  .topbar{background:var(--primary);color:#fff;padding:8px 12px 10px;flex:none}
  .topbar .row1{display:flex;align-items:center;font-size:13px}
  .topbar .row1 .store{font-size:18px;font-weight:800}
  .topbar .row1 .shop{margin-left:8px;font-size:12px;color:#FFD9DE}
  .topbar .row1 .switch{margin-left:auto;font-size:12px;cursor:pointer}
  /* 返回首页按钮：红底上的半透明白圆，点它回入口页 */
  .topbar .row1 .back{
    width:28px;height:28px;border-radius:14px;margin-right:8px;flex:none;
    display:flex;align-items:center;justify-content:center;
    color:#fff;background:rgba(255,255,255,.18);cursor:pointer;
  }
  .topbar .row1 .back:active{background:rgba(255,255,255,.34)}
  .topbar .row1 .back .ic-svg{height:19px}
  .segment{display:flex;margin-top:10px;background:rgba(255,255,255,.16);border-radius:16px;padding:3px}
  .segment div{
    flex:1;text-align:center;font-size:13px;line-height:28px;border-radius:14px;cursor:pointer;color:#fff;
  }
  .segment div.on{background:#fff;color:var(--primary);font-weight:700}

  /* 点餐主体 */
  .menu{flex:1;display:flex;overflow:hidden}
  .sidebar{width:88px;background:var(--sidebar);overflow-y:auto;flex:none;scrollbar-width:none}
  .sidebar::-webkit-scrollbar{display:none}
  .sidebar .item{
    height:56px;display:flex;align-items:center;font-size:13px;color:var(--text);
    padding:0 8px 0 0;cursor:pointer;border-left:3px solid transparent;
  }
  .sidebar .item.on{background:#fff;color:var(--primary);font-weight:700;border-left-color:var(--primary)}
  .products{flex:1;overflow-y:auto;background:#fff;scrollbar-width:none}
  .products::-webkit-scrollbar{display:none}
  .cat-title{font-size:12px;color:var(--sub);background:var(--bg);padding:10px 12px 6px;position:sticky;top:0;z-index:2}
  .prod{display:flex;gap:10px;padding:12px;border-bottom:1px solid #FAFAFA}
  .thumb{
    width:78px;height:78px;border-radius:16px;background:#FFF4E0;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:36px;
  }
  .prod .info{flex:1;min-width:0;display:flex;flex-direction:column;height:78px}
  .prod .name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prod .desc{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.4;max-height:30px;overflow:hidden}
  .prod .foot{margin-top:auto;display:flex;align-items:center}
  .price{color:var(--primary);font-weight:800;font-size:17px}
  .price small{font-size:11px}
  img.thumb{object-fit:cover;display:block;padding:0}
  .origin{color:var(--sub);font-size:11px;text-decoration:line-through;margin-right:4px}
  .plus{
    margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;cursor:pointer;
    line-height:1;user-select:none;
  }
  .plus.off{background:#D0D0D0;cursor:not-allowed}

  /* 底部购物车栏 */
  .cartbar{
    height:60px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;
    padding:0 12px;flex:none;gap:10px;
  }
  .carticon{
    width:44px;height:44px;border-radius:50%;background:#CCC;color:#fff;font-size:20px;
    display:flex;align-items:center;justify-content:center;position:relative;flex:none;
  }
  .carticon.on{background:var(--primary)}
  .badge{
    position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;border-radius:8px;background:#fff;
    color:var(--primary);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;
    padding:0 3px;border:1px solid var(--primary);
  }
  .cartinfo{flex:1;cursor:pointer;min-width:0}
  .cartinfo .amt{font-size:18px;font-weight:800;color:var(--primary)}
  .cartinfo .amt small{font-size:11px}
  .cartinfo .sub{font-size:10px;color:var(--hint);margin-top:2px}

  /* 底部 tab */
  .tabbar{height:52px;background:#fff;border-top:1px solid var(--line);display:flex;flex:none}
  .tabbar div{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:11px;color:var(--sub);gap:2px;cursor:pointer;
  }
  .tabbar div.on{color:var(--primary)}

  /* 列表卡片 */
  .list{padding:10px 12px;overflow-y:auto;flex:1;scrollbar-width:none}
  .list::-webkit-scrollbar{display:none}
  .card{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px}
  .line{display:flex;align-items:center;gap:8px}
  .muted{color:var(--sub);font-size:12px}
  .hint{color:var(--hint);font-size:11px}
  .divider{height:1px;background:var(--line);margin:8px 0}
  .field{display:flex;align-items:center;margin-top:10px}
  .field label{width:64px;font-size:13px;color:var(--sub);flex:none}
  .field input{
    flex:1;height:38px;border:none;background:#F7F7F7;border-radius:8px;padding:0 10px;
    font-size:13px;font-family:inherit;min-width:0;
  }
  .stepper{display:flex;align-items:center;gap:8px;flex:none}
  .stepper .op{
    width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--text);background:#fff;
  }
  .stepper .op.plusop{background:var(--primary);border-color:var(--primary);color:#fff}
  .stepper .qty{min-width:22px;text-align:center;font-size:14px;font-weight:700}
  .banner{background:var(--primary);color:#fff;padding:20px 12px;text-align:center;flex:none}
  .banner .code{font-size:40px;font-weight:800;letter-spacing:2px;margin-top:6px}
  .banner .st{font-size:20px;font-weight:700}
  .banner .sub{font-size:12px;color:#FFD9DE;margin-top:8px}
  .chips{display:flex;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);flex:none}
  .chips div{
    flex:1;text-align:center;height:30px;line-height:30px;border-radius:15px;font-size:13px;
    color:var(--sub);cursor:pointer;
  }
  .chips div.on{background:var(--primary);color:#fff;font-weight:700}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
  .profile{background:var(--primary);color:#fff;padding:20px 12px;flex:none;display:flex;align-items:center;gap:12px}
  .avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.24);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
  .vip{background:var(--accent);color:#7A4B00;font-size:10px;border-radius:4px;padding:1px 5px;margin-left:8px;font-weight:700}
  .rows{background:#fff;margin-top:10px;flex:none}
  .rows .r{height:50px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
  .rows .r .ic{width:28px;font-size:18px}
  .rows .r .ar{margin-left:auto;color:var(--hint)}
  .pad{padding:0 12px}

  /* 入口页 —— 仿肯德基小程序开屏：整屏肯德基红 + 品牌徽标 + 官方菜品图 + 两张白色入口卡 */
  /* ================= 入口页（仿肯德基小程序首屏） =================
     结构：红色 hero（天际线 + 门店 + 骑手 + 车速取）
           → 三个取餐通道 → 四个功能圆图标 → 会员卡
           → APP热卖/大神卡专区 → 2 列商品 → 两张券 → 深色底部 tab
     顶部「肯德基 / 肯律轻食 / 肯悦咖啡 / 炸鸡兄弟」频道栏按要求先不做。 */
  .entry{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#F2F2F2}
  .entry-scroll{flex:1;overflow-y:auto;scrollbar-width:none}
  .entry-scroll::-webkit-scrollbar{display:none}

  /* ---- 1. 红色 hero ---- */
  .ehero{position:relative;overflow:hidden;background:linear-gradient(180deg,#E4002B 0%,#DC0027 58%,#C6001F 100%)}
  .ehero .skyline{position:absolute;left:0;bottom:0;width:100%;height:150px;display:block}
  .ehero .scene{position:relative;display:block;width:100%;height:auto}

  /* ---- 2. 三个取餐通道 ---- */
  .echs{display:flex;background:#fff;height:46px}
  .echs .ch{
    flex:1;display:flex;align-items:center;justify-content:center;
    font-size:14.5px;font-weight:700;color:#1A1A1A;cursor:pointer;letter-spacing:-.3px;
  }
  .echs .ch em{font-style:normal;color:#A8A8A8;font-size:15px;margin-left:2px;font-weight:400}
  .echs .ch:active{opacity:.55}

  /* ---- 3. 四个功能圆图标 ---- */
  .etools{display:flex;background:#fff;padding:2px 4px 12px}
  .etools .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
  .etools .t .ic{
    width:46px;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;
    background:#FFFFFF;box-shadow:0 2px 9px rgba(0,0,0,.10);
  }
  .etools .t span{font-size:10.5px;color:#2B2B2B;letter-spacing:-.2px}
  .etools .t:active{opacity:.6}
  .edots{display:flex;justify-content:center;gap:4px;background:#fff;padding:0 0 9px}
  .edots i{width:5px;height:5px;border-radius:3px;background:#E0E0E0}
  .edots i.on{width:13px;background:#E4002B}

  /* ---- 4. 会员卡 ---- */
  .evipwrap{padding:9px 9px 0;background:#F2F2F2}
  .evip{
    position:relative;background:#fff;border-radius:11px;padding:10px 12px;display:flex;align-items:center;
    overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.045);
  }
  .evip .ava{width:42px;height:42px;border-radius:50%;overflow:hidden;flex:none;background:#FFF4F6}
  .evip .mid{flex:1;min-width:0;margin-left:9px;position:relative;z-index:2}
  .evip .l1{display:flex;align-items:center;gap:5px;font-size:14.5px;font-weight:800;color:#1A1A1A;letter-spacing:-.3px}
  .evip .l1 .tag{
    display:inline-flex;align-items:center;gap:2px;flex:none;
    background:linear-gradient(90deg,#4A4A4A,#222);color:#FFD05B;
    font-size:9.5px;font-weight:700;border-radius:8px;padding:2px 6px;
  }
  .evip .l1 .open{font-size:10.5px;color:#AFAFAF;font-weight:400;flex:none}
  .evip .l2{display:flex;align-items:center;gap:13px;margin-top:6px;font-size:10.5px;color:#9A9A9A}
  .evip .l2 u{text-decoration:none;color:#F0A200;font-size:11px;margin-right:2px}
  .evip .l2 b{color:#1A1A1A;font-size:11.5px;font-weight:700;margin-left:2px}
  .evip .wow{
    position:absolute;right:-4px;bottom:-13px;font-size:42px;font-weight:900;font-style:italic;
    color:#FCEEF1;letter-spacing:-2px;pointer-events:none;line-height:1;
  }

  /* ---- 5. tab ---- */
  .etabs{display:flex;gap:22px;padding:13px 14px 4px;background:#F2F2F2}
  .etabs div{font-size:15.5px;font-weight:700;color:#8E8E8E;cursor:pointer;letter-spacing:-.3px}
  .etabs div.on{color:#1A1A1A;font-weight:800}

  /* ---- 6. 商品 2 列网格 ---- */
  .egrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px 9px 0;background:#F2F2F2}
  .egc{position:relative;background:#fff;border-radius:9px;padding:8px 8px 9px;cursor:pointer;overflow:hidden}
  .egc:active{background:#FCFCFC}
  .egc .bd{
    position:absolute;left:0;top:0;z-index:2;background:#E4002B;color:#fff;
    font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:9px 0 9px 0;letter-spacing:-.2px;
  }
  .egc .pic{height:80px;display:flex;align-items:center;justify-content:center}
  .egc .pic img{max-width:100%;max-height:80px;object-fit:contain;display:block}
  .egc .gn{
    font-size:11.5px;color:#1A1A1A;line-height:1.3;height:30px;overflow:hidden;margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .egc .gp{display:flex;align-items:baseline;gap:3px;margin-top:5px}
  .egc .gp b{color:#E4002B;font-size:15px;font-weight:800;letter-spacing:-.5px}
  .egc .gp b small{font-size:10px;font-weight:700;margin-right:1px}
  .egc .gp em{font-style:normal;font-size:9.5px;color:#E4002B}
  .egc .gp s{color:#B8B8B8;font-size:10.5px;margin-left:auto}

  /* ---- 7. 两张券 ---- */
  .ecps{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px 9px 14px;background:#F2F2F2}
  .ecp{
    position:relative;display:flex;align-items:center;gap:6px;border-radius:9px;padding:11px 8px;
    background:linear-gradient(120deg,#FFF0F3,#FFE6EC);overflow:hidden;
  }
  .ecp.warm{background:linear-gradient(120deg,#FFF7E9,#FFEED6)}
  .ecp .ci{width:34px;height:34px;flex:none}
  .ecp .cw{min-width:0}
  .ecp .ct{font-size:10.5px;color:#4A4A4A;white-space:nowrap;letter-spacing:-.2px}
  .ecp .cv{font-size:14px;font-weight:800;color:#E4002B;margin-top:2px;white-space:nowrap}
  .ecp .cv small{font-size:9.5px;font-weight:700}
  .ecp .cb{
    margin-left:auto;flex:none;width:26px;text-align:center;font-size:9px;line-height:1.3;color:#E4002B;
    border-left:1px dashed rgba(228,0,43,.28);padding:2px 0 2px 5px;
  }

  /* ---- 8. 深色底部 tab（中间 AI 点餐凸起） ---- */
  .etabbar{
    flex:none;position:relative;display:flex;align-items:flex-end;height:60px;
    padding-bottom:5px;background:linear-gradient(180deg,#3C3C3C 0%,#1D1D1D 100%);
  }
  .etabbar .tb{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;
    height:50px;cursor:pointer;position:relative;z-index:2;
  }
  .etabbar .tb span{font-size:9.5px;color:#EDEDED;letter-spacing:-.3px;white-space:nowrap}
  .etabbar .tb.on span{color:#FF5468;font-weight:700}
  .etabbar .tb:active{opacity:.6}
  .etabbar .tb.ai{z-index:3}
  .etabbar .tb.ai .ball{
    position:absolute;left:50%;bottom:15px;transform:translateX(-50%);
    width:54px;height:54px;border-radius:27px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#FF4A62 0%,#E4002B 58%,#BE0022 100%);
    box-shadow:0 0 0 5px rgba(228,0,43,.20),0 6px 14px rgba(0,0,0,.42);
    color:#fff;font-size:24px;font-weight:900;letter-spacing:-1px;
  }
  .etabbar .tb.ai span{margin-top:23px;color:#FF5468;font-weight:700}
  .etabbar .tb .k-logo{font-size:19px;font-weight:900;color:#E4002B;font-style:italic;letter-spacing:-1px;line-height:1}
  .etabbar .tb .wow-logo{font-size:15px;font-weight:900;color:#FFF;font-style:italic;letter-spacing:-.5px;line-height:1}

  /* 顶部搜索框 —— 取代原来的「到店自取 / 外送到家」胶囊 */
  .searchbar{
    display:flex;align-items:center;gap:8px;margin-top:10px;height:36px;padding:0 12px;
    background:#fff;border-radius:18px;
  }
  .searchbar .mag{color:var(--hint);display:flex;flex:none}
  .searchbar input{
    flex:1;min-width:0;height:100%;border:none;background:transparent;outline:none;
    font-size:13px;font-family:inherit;color:var(--text);
  }
  .searchbar input::placeholder{color:var(--hint)}
  .searchbar .clear{
    width:18px;height:18px;border-radius:50%;background:#DCDCDC;color:#fff;font-size:13px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;line-height:1;
  }
  .searchbar .clear.hide{display:none}

  /* 搜索结果提示条 */
  .result-bar{
    display:flex;align-items:center;padding:9px 12px;background:#fff;flex:none;
    border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);
  }
  .result-bar b{color:var(--primary);margin:0 2px}

  /* 矢量图标（内联 SVG，stroke=currentColor 直接继承文字色，不再用 emoji 字体） */
  .ic-svg{display:flex;align-items:center;justify-content:center}
  .tabbar div .ic-svg{height:22px}
  .rows .r .ic{width:28px;display:flex;align-items:center;color:var(--sub)}
  .empty .big{display:flex;align-items:center;justify-content:center;color:var(--hint)}
</style>
</head>
<body>

<div class="page-title">KFC 点餐 · 前后端联调预览</div>
<div class="page-hint">
  这个页面跑在 Spring Boot 的静态资源里，和接口同源，用来在没有模拟器/真机时<br>
  验证「鸿蒙端界面 + 后端 CRUD」这条链路。数据都是真实接口返回的。<br>
  接口地址 <code id="apiBase"></code> 　后端状态 <code id="health">检测中…</code>
</div>

<div class="phone">
  <div class="statusbar">
    <span id="clock">21:00</span>
    <span>KFC 点餐</span>
    <span>100%</span>
  </div>
  <div class="screen" id="screen"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================ 基础设施 ============================ */
const state = {
  // entry 是最外层的入口页（外送 / 到店自取），两个入口都进 menu：界面完全一样
  view: 'entry',           // entry | menu | cart | orders | orderDetail | address | mine | login
  userId: 0,
  user: null,
  /** 取餐方式，由入口页两张卡决定；只影响点餐页顶部标签，不参与下单（订单仍写死 PICKUP） */
  pickupType: 'PICKUP',
  categories: [],
  activeCategory: 0,

async function api(path, method, body) {
  const res = await fetch('/api' + path, {
    method: method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  const json = await res.json();
  if (json.code !== 200) throw new Error(json.message || ('HTTP ' + res.status));
  return json.data;
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function thumbHtml(img, size) {
  const s = size || 78;
  if (!img) {
    return '<div class="thumb" style="width:' + s + 'px;height:' + s + 'px"></div>';
  }
  return '<img class="thumb" style="width:' + s + 'px;height:' + s + 'px;object-fit:cover" src="' + esc(img) + '" alt="">';
}
function dt(iso) {
  if (!iso) return '';
  const d = new Date(iso.replace(/\.(\d{3})\d+/, '.$1'));
  if (isNaN(d.getTime())) return iso;
  const p = n => (n < 10 ? '0' + n : '' + n);
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const esc = s => String(s === undefined || s === null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* 关键词搜索：停顿 300ms 才发请求，避免每敲一个字都打一次接口 */
let searchTimer = null;
function scheduleSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 300);
}
async function runSearch() {
  const kw = state.keyword.trim();
  if (!kw) {
    state.searchResults = [];
    state.searching = false;
    render();
    return;
  }
  state.searching = true;
  render();
  try {
    state.searchResults = await api('/products/search?keyword=' + encodeURIComponent(kw));
  } catch (e) {
    state.searchResults = [];
    toast(e.message);
  }
  state.searching = false;
  render();
}
function clearKeyword() {
  state.keyword = '';
  state.searchResults = [];
  state.searching = false;
  state.searchFocus = true;
  render();
}
async function loadCart() {
  if (!state.userId) { state.cartItems = []; state.cartCount = 0; state.cartAmount = 0; return; }
  state.cartItems = await api('/cart-items?userId=' + state.userId);
  const s = await api('/cart-items/summary?userId=' + state.userId);
  state.cartCount = s.count;
  state.cartAmount = Number(s.amount);
}
async function loadOrders() {
  if (!state.userId) { state.orders = []; return; }
  state.orders = await api('/orders?userId=' + state.userId);
}
async function loadAddresses() {
  if (!state.userId) { state.addresses = []; return; }
  state.addresses = await api('/addresses?userId=' + state.userId);
}
async function login(username, password) {
  const user = await api('/users/login', 'POST', { username, password });
  state.userId = user.id;
  state.user = user;
  await loadCart();
  return user;
}
async function addToCart(product) {
  if (!state.userId) { toast('请先登录'); go('login'); return; }
  try {
    await api('/cart-items', 'POST', { userId: state.userId, productId: product.id, quantity: 1 });
    await loadCart();
    toast('已加入 ' + product.name);
    render();
  } catch (e) { toast(e.message); }
}

/* ============================ 视图切换 ============================ */
function go(view) {
  state.view = view;
  // 离开点餐页就别再把焦点塞回搜索框
  if (view !== 'menu') state.searchFocus = false;
  // 回首页时把搜索状态清干净，否则再从入口进来会停在搜索结果上
  if (view === 'entry') {
    state.keyword = '';
    state.searchResults = [];
    state.searching = false;
  }
  if (view === 'cart') loadCart().then(render).catch(e => toast(e.message));
  if (view === 'orders') loadOrders().then(render).catch(e => toast(e.message));
  if (view === 'address') loadAddresses().then(render).catch(e => toast(e.message));
  if (view === 'mine' && state.userId) {
    api('/users/' + state.userId).then(u => { state.user = u; render(); }).catch(() => {});
  }
  render();
}

/* 从真实菜单里挑一款陈列品：按关键词命中，都不中就用第 idx 个有图的
   used 里是已占用的**餐品名** —— 四个陈列位必须是四款不同餐品。
   注意不能按 id 去重：真实菜单里同一款会挂在两个分类下
   （如「四味小食拼盘」在人气热卖 id=27、炸鸡小食 id=42），
   按 id 去重挡不住，页面上会并排出现两张一模一样的卡。 */
function cfPick(keys, idx, used) {
  const all = state.categories.flatMap(c => c.products).filter(p => p.image);
  if (!all.length) return null;
  const free = all.filter(p => !used || !used.has(p.name));
  const pool = free.length ? free : all;
  for (let i = 0; i < keys.length; i++) {
    const hit = pool.find(p => p.name.indexOf(keys[i]) >= 0);
    if (hit) return hit;
  }
  return pool[idx % pool.length];
}

/* 首页 4 个陈列位：角标和价格照截图写，图与名称用真实菜单，找不到就用兜底候选 */
function cfCards(tab) {
  const conf = (tab === 'VIP') ? [
    { keys: ['生椰'], badge: '', price: '9.9', origin: '22', idx: 3 },
    { keys: ['拿铁'], badge: '', price: '9.9', origin: '19', idx: 9 },
    { keys: ['美式'], badge: '', price: '9.9', origin: '18', idx: 15 },
    { keys: ['三柠', '气泡'], badge: '', price: '9.9', origin: '19', idx: 21 }
  ] : [
    { keys: ['周末疯狂', '疯狂拼', '拼'], badge: '4件299', price: '29.9', from: true, origin: '63.6', idx: 0 },
    { keys: ['三柠', '气泡'], badge: '', price: '9.9', origin: '19', idx: 12 },
    { keys: ['周末疯狂', '疯狂拼', '拼', '桶'], badge: '8件499', price: '49.9', from: true, origin: '127', idx: 1 },
    { keys: ['生椰', '拿铁'], badge: '', price: '9.9', origin: '22', idx: 40 }
  ];
  const used = new Set();
  return conf.map((c, i) => {
    const p = cfPick(c.keys, c.idx + i * 7, used);
    if (!p) return '';
    used.add(p.name);
    return `<div class="egc" data-entry="DELIVERY">
      ${c.badge ? `<span class="bd">${c.badge}</span>` : ''}
      <div class="pic"><img src="${esc(p.image)}" alt=""></div>
      <div class="gn">${esc(p.name)}</div>
      <div class="gp"><b><small>¥</small>${c.price}</b>${c.from ? '<em>起</em>' : ''}<s>¥${c.origin}</s></div>
    </div>`;
  }).join('');
}

function viewOrders() {
  const filters = [['ALL','全部'],['PENDING_PAYMENT','待支付'],['ONGOING','进行中'],['DONE','已完成']];
  const chips = filters.map(([k, label]) =>
    `<div class="${state.orderFilter === k ? 'on' : ''}" data-filter="${k}">${label}</div>`).join('');

  const visible = state.orders.filter(o => {
    if (state.orderFilter === 'ALL') return true;
    if (state.orderFilter === 'PENDING_PAYMENT') return o.status === 'PENDING_PAYMENT';
    if (state.orderFilter === 'ONGOING') return o.status === 'PAID' || o.status === 'READY';
    return o.status === 'COMPLETED' || o.status === 'CANCELLED';
  });

  const body = visible.length ? visible.map(o => {
    const first = o.items && o.items.length ? o.items[0] : null;
    let acts = '';
    if (o.status === 'PENDING_PAYMENT') {
      acts = `<div class="actions">
        <button class="btn gray" data-cancel="${o.id}">取消订单</button>
        <button class="btn" data-pay="${o.id}">立即支付</button></div>`;
    } else {
      acts = `<div class="actions"><button class="btn gray" data-detail="${o.id}">查看详情</button></div>`;
    }
    return `<div class="card">
      <div class="line">
        <span class="hint">订单号 ${esc(o.orderNo)}</span>
        <span style="margin-left:auto;font-size:13px;font-weight:700;color:${o.status === 'CANCELLED' ? 'var(--sub)' : 'var(--primary)'}">${esc(o.statusText)}</span>
      </div>
      <div class="divider"></div>
      <div class="line">
        ${thumbHtml(first ? first.productImage : '', 54)}
        <div style="flex:1;min-width:0;margin-left:4px">
          <div style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
            ${esc(first ? first.productName : '（无明细）')}</div>
          <div class="muted" style="margin-top:4px">共 ${o.itemCount} 件 · ${esc(o.pickupTypeText)}</div>
          <div class="hint" style="margin-top:2px">${dt(o.createdAt)}</div>
        </div>
        <div style="text-align:right">
          <div class="hint">实付</div>
          <div class="price" style="font-size:15px">¥${money(o.payAmount)}</div>
        </div>
      </div>
      ${o.pickupCode ? `<div class="hint" style="margin-top:8px;color:var(--primary);font-weight:700">取餐码 ${esc(o.pickupCode)}</div>` : ''}
      ${acts}
    </div>`;
  }).join('') : `<div class="empty">${ICON.receiptBig}<div>还没有订单</div></div>`;

  return navBar('我的订单', 'menu', '<span data-act="reload-orders">刷新</span>') +
    `<div class="chips">${chips}</div><div class="list">${body}</div>${tabBar('orders')}`;
}

      <div class="muted" style="margin-top:6px">${esc(a.fullAddress)}</div>
      <div class="actions">
        ${a.isDefault ? '' : `<button class="btn gray" data-set-default="${a.id}">设为默认</button>`}
        <button class="btn gray" data-del-address="${a.id}">删除</button>
      </div>
    </div>`).join('') : `<div class="empty" style="flex:none;padding:30px 0">${ICON.pinBig}<div>还没有收货地址</div></div>`;

  return navBar('收货地址', 'mine') + `<div class="list">${form}${list}</div>`;
}

/* ---------- 我的 ---------- */

  const u = state.user;
  const head = u ? `
    <div class="profile">
      <div class="avatar" style="color:#fff">${ICON.person}</div>
      <div>
        <div style="font-size:17px;font-weight:700">${esc(u.nickname || u.username)}<span class="vip">WOW 会员</span></div>
        <div style="font-size:12px;color:#FFD9DE;margin-top:6px">${esc(u.phone || '未绑定手机号')}</div>
      </div>
    </div>` : `
    <div class="profile">
      <div class="avatar" style="background:rgba(255,255,255,.2);color:#fff">${ICON.person}</div>
      <div style="flex:1">
        <div style="font-size:17px;font-weight:700">未登录</div>
        <div style="font-size:12px;color:#FFD9DE;margin-top:6px">登录后可下单、查看订单</div>
      </div>
      <button class="btn" style="background:#fff" data-tab="login">登录</button>
    </div>`;

  return head + `
    <div class="rows">
      <div class="r" data-tab="orders"><span class="ic">${ICON.receipt}</span>我的订单<span class="ar">›</span></div>
      <div class="r" data-tab="address"><span class="ic">${ICON.pin}</span>收货地址<span class="ar">›</span></div>
      <div class="r" data-tab="menu"><span class="ic">${ICON.burger}</span>去点餐<span class="ar">›</span></div>
      <div class="r" data-tab="entry"><span class="ic">${ICON.store}</span>重新选择取餐方式<span class="ar">›</span></div>
      <div class="r" data-tab="login"><span class="ic">${ICON.key}</span>切换账号 / 注册<span class="ar">›</span></div>
    </div>
    <div class="pad" style="margin-top:20px">
      <button class="btn ghost" style="width:100%" data-act="demo-login">演示账号一键登录</button>
      ${state.userId ? '<button class="btn gray" style="width:100%;margin-top:10px" data-act="logout">退出登录</button>' : ''}
    </div>
    <div style="height:20px"></div>
    ${tabBar('mine')}`;
}

/* ---------- 登录 / 注册 ---------- */
function viewLogin() {
  const lf = state.loginForm;
  const isLogin = state.loginMode === 'LOGIN';
  return navBar(isLogin ? '登录' : '注册', 'mine') + `
    <div style="padding:40px 24px 0">
      <div style="font-size:26px;font-weight:800;color:var(--primary)">KFC 点餐</div>
      <div class="muted" style="margin-top:6px">鸿蒙端演示工程 · 前后端联调</div>
      <div class="field"><label>账号</label><input id="l-username" value="${esc(lf.username)}"></div>
      <div class="field"><label>密码</label><input id="l-password" type="password" value="${esc(lf.password)}"></div>
      ${isLogin ? '' : `<div class="field"><label>昵称</label><input id="l-nickname" value="${esc(lf.nickname)}" placeholder="选填"></div>
      <div class="field"><label>手机号</label><input id="l-phone" value="${esc(lf.phone)}" placeholder="选填"></div>`}
      <button class="btn" style="width:100%;height:44px;border-radius:22px;margin-top:24px" data-act="submit-login">
        ${isLogin ? '登 录' : '注 册'}</button>
      <div style="text-align:center;color:var(--primary);font-size:13px;margin-top:16px;cursor:pointer" data-act="toggle-login-mode">
        ${isLogin ? '没有账号？去注册' : '已有账号？去登录'}</div>
      <div class="card" style="margin-top:30px;background:#FFF4E0">
        <div class="muted">演示账号</div>
        <div style="margin-top:4px">账号 <b>${DEMO.username}</b>　密码 <b>${DEMO.password}</b></div>
        <div class="hint" style="margin-top:4px">数据来自后端 t_user 表的种子数据</div>
      </div>
    </div>`;
}

/* ============================ 事件绑定 ============================ */
function bind() {
  const screen = document.getElementById('screen');

  // 点分类 → 右侧滚动
  screen.querySelectorAll('[data-cat]').forEach(el => {
    el.onclick = () => {
      const i = Number(el.dataset.cat);
      state.activeCategory = i;
      const sec = screen.querySelector(`[data-sec="${i}"]`);
      const list = document.getElementById('products');
      if (sec && list) list.scrollTop = sec.offsetTop;
      render();
      // 重新渲染后把滚动位置补回去
      const list2 = document.getElementById('products');
      const sec2 = screen.querySelector(`[data-sec="${i}"]`);
      if (list2 && sec2) list2.scrollTop = sec2.offsetTop;
    };
  });

  // 右侧滚动 → 左侧高亮
  const products = document.getElementById('products');
  if (products) {
    products.onscroll = () => {
      const secs = screen.querySelectorAll('[data-sec]');
      let idx = 0;
      secs.forEach((s, i) => { if (s.offsetTop - products.scrollTop <= 8) idx = i; });
      if (idx !== state.activeCategory) {
        state.activeCategory = idx;
        screen.querySelectorAll('[data-cat]').forEach((el, i) => el.classList.toggle('on', i === idx));
      }
    };
  }

  screen.querySelectorAll('[data-add]').forEach(el => {
    el.onclick = () => {
      const p = state.categories.flatMap(c => c.products).find(x => x.id === Number(el.dataset.add));
      if (p) addToCart(p);
    };
  });

  // 搜索框：输入即搜（300ms 防抖）
  const kw = document.getElementById('kw');
  if (kw) {
    kw.oninput = () => {
      state.keyword = kw.value;
      state.searchFocus = true;
      scheduleSearch();
    };
    // 整页 innerHTML 重绘会把 input 换掉，所以重绘后要把焦点和光标位置还回去，
    // 否则连续打字打到第二个字就掉焦点了
    if (state.searchFocus) {
      kw.focus();
      const n = kw.value.length;
      try { kw.setSelectionRange(n, n); } catch (e) { /* 个别环境不支持，忽略即可 */ }
    }
  }

  // 入口页的三个取餐通道 + 4 张陈列位：都进同一个点餐页，只把取餐方式记下来
  screen.querySelectorAll('[data-entry]').forEach(el => {
    el.onclick = () => {
      state.pickupType = el.dataset.entry || 'PICKUP';
      state.view = 'menu';
      state.searchFocus = false;
      render();
    };
  });

  // 入口页其余入口（功能图标 / 会员卡 / 券 / 底部 tab）：本轮只做外观，点了给提示
  screen.querySelectorAll('[data-etool],[data-etab]').forEach(el => {
    el.onclick = () => {
      toast((el.dataset.etool || el.dataset.etab) + '：功能陆续开放');
    };
  });

  // APP热卖 / 大神卡专区 切换
  screen.querySelectorAll('[data-ecf]').forEach(el => {
    el.onclick = () => {
      state.entryTab = el.dataset.ecf;
      render();
    };
  });

  screen.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => go(el.dataset.tab);
  });

  screen.querySelectorAll('[data-back]').forEach(el => {
    el.onclick = () => go(el.dataset.back);
  });

  const remark = document.getElementById('remark');
  if (remark) remark.oninput = () => { state.remark = remark.value; };

  // 购物车加减
  screen.querySelectorAll('[data-cart-minus]').forEach(el => {
    el.onclick = async () => {
      const id = Number(el.dataset.cartMinus);
      const item = state.cartItems.find(x => x.id === id);
      if (!item) return;
      try {
        if (item.quantity - 1 <= 0) await api('/cart-items/' + id + '?userId=' + state.userId, 'DELETE');
        else await api('/cart-items/' + id, 'PUT', { quantity: item.quantity - 1 });
        await loadCart(); render();
      } catch (e) { toast(e.message); }
    };
  });
  screen.querySelectorAll('[data-cart-plus]').forEach(el => {
    el.onclick = async () => {
      const id = Number(el.dataset.cartPlus);
      const item = state.cartItems.find(x => x.id === id);
      if (!item) return;
      try {
        await api('/cart-items/' + id, 'PUT', { quantity: item.quantity + 1 });
        await loadCart(); render();
      } catch (e) { toast(e.message); }
    };
  });

  screen.querySelectorAll('[data-act]').forEach(el => {
    el.onclick = () => runAct(el.dataset.act);
  });

  screen.querySelectorAll('[data-pay]').forEach(el => { el.onclick = () => payOrder(Number(el.dataset.pay)); });
  screen.querySelectorAll('[data-cancel]').forEach(el => { el.onclick = () => cancelOrder(Number(el.dataset.cancel)); });
  screen.querySelectorAll('[data-detail]').forEach(el => { el.onclick = () => openDetail(Number(el.dataset.detail)); });
  screen.querySelectorAll('[data-filter]').forEach(el => {
    el.onclick = () => { state.orderFilter = el.dataset.filter; render(); };
  });
  screen.querySelectorAll('[data-set-default]').forEach(el => {
    el.onclick = () => setDefaultAddress(Number(el.dataset.setDefault));
  });
  screen.querySelectorAll('[data-del-address]').forEach(el => {
    el.onclick = () => removeAddress(Number(el.dataset.delAddress));
  });

  // 表单字段（实时回填到 state，渲染时不丢）
  const grab = (id, apply) => { const e = document.getElementById(id); if (e) e.oninput = () => apply(e.value); };
  grab('f-receiver', v => state.addressForm.receiver = v);
  grab('f-phone', v => state.addressForm.phone = v);
  grab('f-province', v => state.addressForm.province = v);
  grab('f-city', v => state.addressForm.city = v);
  grab('f-district', v => state.addressForm.district = v);
  grab('f-detail', v => state.addressForm.detail = v);
  const def = document.getElementById('f-default');
  if (def) def.onchange = () => { state.addressForm.isDefault = def.checked; };
  grab('l-username', v => state.loginForm.username = v);
  grab('l-password', v => state.loginForm.password = v);
  grab('l-nickname', v => state.loginForm.nickname = v);
  grab('l-phone', v => state.loginForm.phone = v);
}

async function runAct(act) {
  try {
    if (act === 'go-cart') {
      if (state.cartCount > 0) go('cart'); else toast('先挑点吃的吧');
    } else if (act === 'back-home') {
      go('entry');
    } else if (act === 'clear-keyword') {
      clearKeyword();
    } else if (act === 'reload-menu') {
      await loadMenu(); render();
    } else if (act === 'reload-orders') {
      await loadOrders(); render(); toast('已刷新');
    } else if (act === 'reload-order') {
      state.currentOrder = await api('/orders/' + state.currentOrder.id); render();
    } else if (act === 'clear-cart') {
      await api('/cart-items?userId=' + state.userId, 'DELETE');
      await loadCart(); render(); toast('购物车已清空');
    } else if (act === 'checkout') {
      await checkout();
    } else if (act === 'demo-login') {
      const u = await login(DEMO.username, DEMO.password);
      toast('已登录 ' + (u.nickname || u.username));
      await loadMenu(); render();
    } else if (act === 'logout') {
      state.userId = 0; state.user = null; state.cartItems = []; state.cartCount = 0; state.cartAmount = 0;
      toast('已退出登录'); render();
    } else if (act === 'toggle-login-mode') {
      state.loginMode = state.loginMode === 'LOGIN' ? 'REGISTER' : 'LOGIN'; render();
    } else if (act === 'submit-login') {
      await submitLogin();
    } else if (act === 'save-address') {
      await saveAddress();
    }
  } catch (e) { toast(e.message); }
}

async function submitLogin() {
  const lf = state.loginForm;
  if (!lf.username || !lf.password) { toast('账号和密码都要填'); return; }
  if (state.loginMode === 'LOGIN') {
    const u = await login(lf.username, lf.password);
    toast('登录成功，欢迎 ' + (u.nickname || u.username));
  } else {
    const u = await api('/users/register', 'POST', {
      username: lf.username, password: lf.password, phone: lf.phone, nickname: lf.nickname
    });
    state.userId = u.id; state.user = u;
    await loadCart();
    toast('注册成功，欢迎 ' + (u.nickname || u.username));
  }
  await loadMenu();
  go('menu');
}

async function payOrder(id) {
  try {
    const o = await api('/orders/' + id + '/pay', 'POST', {});
    toast('支付成功，取餐码 ' + o.pickupCode);
    if (state.view === 'orderDetail') state.currentOrder = o;
    await loadOrders();
    render();
  } catch (e) { toast(e.message); }
}

async function cancelOrder(id) {
  try {
    const o = await api('/orders/' + id + '/cancel', 'POST', {});
    toast('订单已取消');
    if (state.view === 'orderDetail') state.currentOrder = o;
    await loadOrders();
    render();
  } catch (e) { toast(e.message); }
}

async function openDetail(id) {
  try {
    state.currentOrder = await api('/orders/' + id);
    state.view = 'orderDetail';
    render();
  } catch (e) { toast(e.message); }
}

async function checkout() {
  if (!state.userId) { toast('请先登录'); go('login'); return; }
  if (!state.cartItems.length) { toast('购物车是空的'); return; }
  // 下单 → 支付（演示环境没接真实支付，下单后直接调支付拿取餐码）
  // pickupType 仍写死 PICKUP：入口页的外送 / 到店自取只做外观区分，不参与业务
  const order = await api('/orders', 'POST', {
    userId: state.userId, pickupType: 'PICKUP', remark: state.remark
  });
  const paid = await api('/orders/' + order.id + '/pay', 'POST', {});
  state.remark = '';
  await loadCart();
  await loadOrders();
  state.currentOrder = paid;
  state.view = 'orderDetail';
  render();
  toast('支付成功，取餐码 ' + paid.pickupCode);
}

async function saveAddress() {
  const f = state.addressForm;
  if (!f.receiver || !f.phone || !f.detail) { toast('收货人、手机号、详细地址都要填'); return; }
  await api('/addresses', 'POST', {
    userId: state.userId, receiver: f.receiver, phone: f.phone,
    province: f.province, city: f.city, district: f.district, detail: f.detail, isDefault: f.isDefault
  });
  state.addressForm.detail = '';
  toast('地址已保存');
  await loadAddresses();
  render();
}

async function setDefaultAddress(id) {
  const a = state.addresses.find(x => x.id === id);
  if (!a) return;
  try {
    await api('/addresses/' + id, 'PUT', {
      userId: a.userId, receiver: a.receiver, phone: a.phone,
      province: a.province, city: a.city, district: a.district, detail: a.detail, isDefault: true
    });
    await loadAddresses(); render(); toast('已设为默认地址');
  } catch (e) { toast(e.message); }
}

async function removeAddress(id) {
  try {
    await api('/addresses/' + id + '?userId=' + state.userId, 'DELETE');
    await loadAddresses(); render(); toast('已删除');
  } catch (e) { toast(e.message); }
}

/* ============================ 启动 ============================ */
function tickClock() {
  const d = new Date();
  const p = n => (n < 10 ? '0' + n : '' + n);
  document.getElementById('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes());
}
setInterval(tickClock, 20000);
tickClock();

(async function boot() {
  const health = document.getElementById('health');
  try {
    await loadMenu();
    health.textContent = '已连接（' + state.categories.length + ' 个分类）';
  } catch (e) {
    health.textContent = '连不上：' + e.message;
  }
  // 和其他端保持一致：默认用演示账号自动登录，省掉每次手动登录
  try {
    if (!state.userId) {
      await login(DEMO.username, DEMO.password);
      await loadMenu();
    }
  } catch (e) {
    console.warn('自动登录失败', e);
  }
  render();
})();
</script>
</body>
</html>
