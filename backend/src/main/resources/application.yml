server:
  # 默认 8080 在开发机上被一个常驻程序占用了（监听 0.0.0.0:8080，返回 GoAhead 的 404），
  # 所以这里改用 8090。想换回 8080 就改这一行 + 前端 Constants.BASE_URL。
  port: 8090

spring:
  application:
    name: kfc-order
  profiles:
    active: dev

  # 本地密钥文件：.env.local 已在 .gitignore 里，不进仓库。
  # 放在这里的目的：不管用 IDEA 运行、命令行 java -jar、还是脚本启动，都能自动读到
  # KFC_AI_API_KEY，不必每次都先 export 一遍环境变量（漏掉就只剩本地兜底推荐）。
  # optional: 文件不存在时不报错，正常启动，AI 降级为今日热门。
  config:
    import:
      - optional:file:./.env.local[.properties]
      - optional:file:./backend/.env.local[.properties]

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/kfc
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      # 表结构由 resources/db/migration/V1__init_schema.sql 管理，不让 Hibernate 自动改表。
      # 改了实体字段记得同步改脚本，两边必须一致。
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      # password:            # 本地 Redis 未设密码，需要时取消注释
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

logging:
  level:
    com.example.kfc: debug

# ---------------------------------------------------------------------------
# 登录鉴权配置
#   secret 是 HMAC-SHA256 的签名密钥，长度必须 >= 32 字节（256 位）。
#   生产环境务必改成环境变量注入：KFC_AUTH_SECRET=xxx，不要提交进仓库。
#   ttl-minutes 同时决定 JWT 的 exp 和 Redis 会话的过期时间，两者保持一致，
#   否则会出现「Redis 里还有、JWT 已过期」或者反过来的半死状态。
# ---------------------------------------------------------------------------
kfc:
  auth:
    secret: ${KFC_AUTH_SECRET:kfc-order-demo-jwt-secret-key-please-change-in-production-2026}
    ttl-minutes: 60
    header: Authorization
    prefix: "Bearer "

  # -------------------------------------------------------------------------
  # AI 点餐（阿里云百炼 / 通义千问，走 OpenAI 兼容模式）
  #   https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
  #
  #   api-key 用环境变量覆盖：KFC_AI_API_KEY=sk-xxx，别把真 key 推到公开仓库。
  #   model 当前用 qwen3.8-flash：关闭思考链后一次推荐 2~4 秒，够用且便宜。
  #   换模型只改这一行，业务代码不动（都是标准 chat/completions）。
  #
  #   store-* 是推荐卡顶部那行门店信息。菜单是浙江农林大学东湖校区店（HZ2226）
  #   的官方数据，所以门店也钉死成同一家，避免推荐与门店对不上。
  # -------------------------------------------------------------------------
  ai:
    enabled: true
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${KFC_AI_API_KEY:}
    model: qwen3.8-flash
    connect-timeout-ms: 5000
    read-timeout-ms: 40000
    temperature: 0.6
    max-tokens: 900
    store-name: 农林大学餐厅
    store-address: 临安区武肃街666号浙江农林大学东湖校区
    store-distance: 581m
