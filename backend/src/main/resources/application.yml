server:
  # 默认 8080 在开发机上被一个常驻程序占用了（监听 0.0.0.0:8080，返回 GoAhead 的 404），
  # 所以这里改用 8090。想换回 8080 就改这一行 + 前端 Constants.BASE_URL。
  port: 8090

spring:
  application:
    name: kfc-order
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/kfc
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      # 表结构由 resources/db/migration/V1__init_schema.sql 管理，不让 Hibernate 自动改表。
      # 改了实体字段记得同步改脚本，两边必须一致。
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      # password:            # 本地 Redis 未设密码，需要时取消注释
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

logging:
  level:
    com.example.kfc: debug
